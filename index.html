<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Centipede</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Courier New",monospace}
canvas{display:block;width:100%;height:100%}
#debug{position:fixed;top:0;left:0;background:rgba(0,0,0,.8);color:#0f0;font-size:10px;padding:4px;z-index:10;white-space:pre;line-height:1.3;display:none}
.btn{position:fixed;z-index:5;width:76px;height:76px;border-radius:50%;background:rgba(10,30,20,.8);color:#8f9;font-size:24px;display:none;align-items:center;justify-content:center}
.left{left:12px;bottom:24px}.right{left:104px;bottom:24px}.fire{right:12px;bottom:24px}
@media(pointer:coarse){.btn{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="btn left">&#9664;</div>
<div class="btn right">&#9654;</div>
<div class="btn fire">&#8226;</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

let W,H,ship,bullets=[],centipedes=[],mushrooms=[];
let score=0,lives=3,wave=1,gameOver=false;
let keys={left:false,right:false,fire:false};
let particles=[],floatText=[];
let waveClearMsg='',waveClearFrames=0,nextWaveDelay=0;

// Game state machine
let gameState='attract'; // 'attract','playing','gameover'

// Invincibility frames after losing a life
let invincibleTimer=0;

// High score persistence
let highScore=parseInt(localStorage.getItem('centipede_highscore')||'0');

// Extra life tracking
let extraLifeScore=0;

// Configuration - all coordinates are FIELD-RELATIVE (origin at top-left of play area)
const FIELD_W=240;
const MUSH_COLS=7;
const MUSH_ROWS=4;

// Fire rate config
const FIRE_COOLDOWN=8;
let fireTimer=0;

// Field offset (where the play area starts on screen)
const OY=30; // top margin for HUD

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}

// === Audio engine ===
let audioCtx=null;
function getAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}

function playSound(type){
  try{
    const ac=getAudio();if(!ac)return;
    const now=ac.currentTime;
    if(type==='shoot'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='square';
      o.frequency.setValueAtTime(800,now);o.frequency.exponentialRampToValueAtTime(200,now+0.1);
      g.gain.setValueAtTime(0.1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.1);
    }else if(type==='explode'){
      const bufSize=ac.sampleRate*0.2;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
      const s=ac.createBufferSource();const g=ac.createGain();s.buffer=buf;
      g.gain.setValueAtTime(0.15,now);s.connect(g).connect(ac.destination);s.start(now);
    }else if(type==='hit'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='sawtooth';
      o.frequency.setValueAtTime(400,now);o.frequency.exponentialRampToValueAtTime(100,now+0.15);
      g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.15);
    }else if(type==='waveclear'){
      [523,659,784,1047].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='square';o.frequency.value=f;
        g.gain.setValueAtTime(0.08,now+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.12+0.1);
        o.connect(g).connect(ac.destination);o.start(now+i*0.12);o.stop(now+i*0.12+0.12);
      });
    }else if(type==='gameover'){
      [400,350,300,200].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='sawtooth';o.frequency.value=f;
        g.gain.setValueAtTime(0.1,now+i*0.2);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.2+0.18);
        o.connect(g).connect(ac.destination);o.start(now+i*0.2);o.stop(now+i*0.2+0.2);
      });
    }else if(type==='hurt'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='sawtooth';
      o.frequency.setValueAtTime(300,now);o.frequency.exponentialRampToValueAtTime(50,now+0.3);
      g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.3);
    }else if(type==='mushroom'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='triangle';
      o.frequency.setValueAtTime(600,now);o.frequency.exponentialRampToValueAtTime(300,now+0.05);
      g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.05);
    }
  }catch(e){}
}

// === Utility functions - all use field-relative coords, convert to screen in draw ===
function addParticles(fx,fy,color,count){
  // Store as field-relative; draw() converts to screen
  for(let i=0;i<count;i++)particles.push({x:fx,y:fy,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:20+Math.random()*15,color,size:2+Math.random()*3});
}

function addFloatText(fx,fy,text,color){
  // Store as field-relative; draw() converts to screen
  floatText.push({x:fx,y:fy,text:typeof text==='string'?[text]:text,color:color||'#ff0',life:60,vy:-1});
}

// === Input handling ===
document.addEventListener('keydown',function(e){
  if(gameState==='attract'&&(e.key===' '||e.key==='Enter')){
    e.preventDefault();getAudio();startGame();return;
  }
  if(gameState==='gameover'&&e.key===' '){startGame();return;}
  if(e.key==='ArrowLeft')keys.left=true;
  if(e.key==='ArrowRight')keys.right=true;
  if(e.key===' ')keys.fire=true;
  if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')keys.left=false;
  if(e.key==='ArrowRight')keys.right=false;
  if(e.key===' ')keys.fire=false;
});

document.querySelector('.btn.left').addEventListener('touchstart',function(e){e.preventDefault();keys.left=true;},{passive:false});
document.querySelector('.btn.left').addEventListener('touchend',function(e){e.preventDefault();keys.left=false;},{passive:false});
document.querySelector('.btn.right').addEventListener('touchstart',function(e){e.preventDefault();keys.right=true;},{passive:false});
document.querySelector('.btn.right').addEventListener('touchend',function(e){e.preventDefault();keys.right=false;},{passive:false});
document.querySelector('.btn.fire').addEventListener('touchstart',function(e){e.preventDefault();keys.fire=true;},{passive:false});
document.querySelector('.btn.fire').addEventListener('touchend',function(e){e.preventDefault();keys.fire=false;},{passive:false});

// Touch/click to start from attract screen
canvas.addEventListener('touchstart',function(e){
  if(gameState==='attract'){e.preventDefault();getAudio();startGame();return;}
  if(gameState==='gameover'){e.preventDefault();startGame();}
},{passive:false});
canvas.addEventListener('click',function(e){
  if(gameState==='attract'){getAudio();startGame();return;}
  if(gameState==='gameover'){startGame();}
});

// === Game initialization ===
function startGame(){
  score=0;lives=3;wave=1;gameOver=false;
  bullets=[];centipedes=[];mushrooms=[];particles=[];floatText=[];
  waveClearMsg='';waveClearFrames=0;nextWaveDelay=0;
  invincibleTimer=0;fireTimer=0;extraLifeScore=0;
  // Ship position: field-relative (bottom of play area)
  ship={x:FIELD_W/2,y:H-OY-30};
  spawnMush();spawnCenti();
  gameState='playing';
}

// === Centipede spawning (field-relative) ===
function spawnCenti(){
  const segCount=Math.min(9+Math.floor(wave*0.8),24);
  const fromLeft=(wave%2===1);
  const dirX=fromLeft?1:-1;
  const startX=fromLeft?-5:FIELD_W+5;
  // Speed ramp: gentle increase, capped at wave 20
  const spd=1.0+Math.min(wave,20)*0.08;
  const segGap=8;

  const segs=[];
  for(let i=0;i<segCount;i++){
    // Spawn at top of field (y=5 is just below the border)
    segs.push({x:startX-i*segGap*dirX,y:5+i*2,w:7,h:5});
  }
  const trail=[];
  for(let i=0;i<segCount*2+10;i++){
    trail.push({x:startX-i*spd*dirX,y:5+i*2});
  }
  centipedes.push({segs,dirX,speed:spd,mushCooldown:0,trail});
}

function spawnMush(){
  const mushW=FIELD_W/MUSH_COLS;
  // Mushrooms positioned within visible field area (field-relative y)
  const startY=40; // start below the top border area
  for(let r=0;r<MUSH_ROWS;r++){
    for(let c=0;c<MUSH_COLS;c++){
      // Pre-compute mushroom spot positions (seeded by position) to avoid flickering
      const spots=[];
      let seed=c*100+r*7+42;
      const spotCount=Math.floor(mushW*0.7/4);
      for(let s=0;s<spotCount;s++){
        seed=(seed*1103515245+12345)&0x7fffffff;
        const angle=Math.PI+(seed%360)/360*Math.PI;
        seed=(seed*1103515245+12345)&0x7fffffff;
        const dist=mushW*0.7/4+s*1.5;
        spots.push({angle,dist});
      }
      mushrooms.push({x:mushW*c+mushW/2,y:startY+r*30,w:mushW*0.7,h:16,hp:4,spots});
    }
  }
}

// === Centipede update (field-relative) ===
function updateCenti(c){
  const head=c.segs[0];
  if(!c.mushCooldown)c.mushCooldown=0;

  // Record head's current position in trail buffer (before moving)
  if(!c.trail)c.trail=[];
  c.trail.unshift({x:head.x,y:head.y});
  if(c.trail.length>c.segs.length*3+20)c.trail.pop();

  // Move head horizontally
  head.x+=c.dirX*c.speed;

  // Slow downward progression (1px every 8 frames)
  c.mushCooldown++;
  if(c.mushCooldown%8===0){head.y+=1;}

  // Mushroom collision - turn and drop down (head only)
  for(let i=0;i<mushrooms.length;i++){
    const m=mushrooms[i];
    if(head.x+head.w/2>m.x-m.w/2&&head.x-head.w/2<m.x+m.w/2&&
       head.y+head.h/2>m.y-m.h/2&&head.y-head.h/2<m.y+m.h/2){
      if(c.mushCooldown>15){c.dirX*=-1;head.y+=16;c.mushCooldown=0;break;}
    }
  }

  // Wall bounce - reverse and drop down
  if(head.x<-10||head.x>FIELD_W+10){c.dirX*=-1;head.y+=8;}

  // Body segments follow the trail
  for(let i=1;i<c.segs.length;i++){
    const trailIdx=i*2;
    if(trailIdx<c.trail.length){
      c.segs[i].x=c.trail[trailIdx].x;
      c.segs[i].y=c.trail[trailIdx].y;
    }
  }

  // Only head damages mushrooms, with cooldown per mushroom
  const seg=c.segs[0];
  for(let mi=mushrooms.length-1;mi>=0;mi--){
    const m=mushrooms[mi];
    if(Math.hypot(seg.x-m.x,seg.y-m.y)<m.w/2+4){
      if(!m.centiHitTimer||m.centiHitTimer<=0){
        m.hp--;if(m.hp<=0)mushrooms.splice(mi,1);else{m.w*=0.75;m.h*=0.75;}
        m.centiHitTimer=30; // 30-frame cooldown per mushroom
      }
    }
    if(m.centiHitTimer)m.centiHitTimer--;
  }

  // Game over check: field-relative bottom of play area
  const fieldBottom=H-OY-20; // field height minus margin
  if(head.y>fieldBottom){gameOver=true;}
}

// === Drawing functions (convert field coords to screen) ===
function drawCenti(c,ox){
  const t=performance.now()/200;

  for(let i=0;i<c.segs.length;i++){
    const seg=c.segs[i];
    // Convert field-relative to screen coords
    const sx=ox+seg.x, sy=OY+seg.y;

    if(i===0){
      const dir=c.dirX;
      ctx.shadowColor='#ff4422';ctx.shadowBlur=8;
      ctx.fillStyle='#ff4422';
      ctx.beginPath();ctx.ellipse(sx,sy,seg.w/2+1,seg.h/2+2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff6644';
      ctx.beginPath();ctx.ellipse(sx,sy-1,seg.w/3,seg.h/4,0,Math.PI,Math.PI*2);ctx.fill();
      const antWave=Math.sin(t*3)*2;
      ctx.strokeStyle='#ff8866';ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(sx-2,sy-seg.h/2);ctx.quadraticCurveTo(sx-4+antWave,sy-seg.h/2-6,sx-5+antWave*1.5,sy-seg.h/2-8);
      ctx.moveTo(sx+2,sy-seg.h/2);ctx.quadraticCurveTo(sx+4-antWave,sy-seg.h/2-6,sx+5-antWave*1.5,sy-seg.h/2-8);
      ctx.stroke();
      ctx.fillStyle='#ffaa88';
      ctx.beginPath();ctx.arc(sx-5+antWave*1.5,sy-seg.h/2-8,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+5-antWave*1.5,sy-seg.h/2-8,1.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      const eyeOff=dir*1.5;
      ctx.beginPath();ctx.arc(sx-3+eyeOff,sy-seg.h/4,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+3+eyeOff,sy-seg.h/4,2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      const pupilOff=dir*1;
      ctx.beginPath();ctx.arc(sx-3+eyeOff+pupilOff,sy-seg.h/4,1.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+3+eyeOff+pupilOff,sy-seg.h/4,1.2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#cc2200';ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(sx-4+dir*2,sy+seg.h/4);ctx.lineTo(sx-dir*3,sy+seg.h/2);
      ctx.moveTo(sx+4+dir*2,sy+seg.h/4);ctx.lineTo(sx-dir*3,sy+seg.h/2);
      ctx.stroke();
      ctx.shadowBlur=0;
    }else if(i===c.segs.length-1){
      const tailWag=Math.sin(t*4)*1.5;
      ctx.shadowColor='#44cc22';ctx.shadowBlur=6;
      ctx.fillStyle='#44cc22';
      ctx.beginPath();
      ctx.moveTo(sx-seg.w/3,sy-seg.h/2);ctx.lineTo(sx+seg.w/3,sy-seg.h/2);
      ctx.quadraticCurveTo(sx+seg.w/4,sy+tailWag,sx,sy+seg.h/2);
      ctx.quadraticCurveTo(sx-seg.w/4,sy+tailWag,sx-seg.w/3,sy-seg.h/2);
      ctx.fill();
      ctx.fillStyle='#66ee44';
      ctx.beginPath();ctx.arc(sx,sy-seg.h/4,1.5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }else{
      const bodyPulse=Math.sin(t*2+i*0.5)*0.3;
      ctx.shadowColor=i%2===0?'#cc3311':'#dd5533';ctx.shadowBlur=4;
      ctx.fillStyle=i%2===0?'#cc3311':'#dd5533';
      ctx.beginPath();ctx.ellipse(sx,sy,seg.w/2+bodyPulse,seg.h/2+0.5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=i%2===0?'#ee5533':'#ff7755';
      ctx.beginPath();ctx.ellipse(sx,sy-1,seg.w/3,bodyPulse+0.5,0,Math.PI,Math.PI*2);ctx.fill();
      ctx.fillStyle=i%2===0?'#992200':'#aa3311';
      ctx.beginPath();ctx.ellipse(sx,sy+1,seg.w/3,bodyPulse+0.5,0,0,Math.PI);ctx.fill();
      if(i>0){
        const prev=c.segs[i-1];
        ctx.strokeStyle='#aa2200';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(ox+prev.x,OY+prev.y);ctx.lineTo(sx,sy);ctx.stroke();
      }
      ctx.shadowBlur=0;
    }
  }
}

function drawMush(m,ox){
  const sx=ox+m.x, sy=OY+m.y;

  ctx.shadowColor='#3a8030';ctx.shadowBlur=6;
  ctx.fillStyle='#4a6040';ctx.fillRect(sx-2,sy+1,4,m.h/2);
  ctx.fillStyle='#5a7050';ctx.fillRect(sx-1,sy+1,2,m.h/2);
  ctx.fillStyle='#3a8030';
  ctx.beginPath();ctx.arc(sx,sy-2,m.w/2,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a9040';
  ctx.beginPath();ctx.arc(sx,sy-3,m.w/3,Math.PI*0.8,Math.PI*1.2);ctx.fill();

  // Use pre-computed spots instead of Math.random()
  ctx.fillStyle='#66cc66';
  if(m.spots){
    for(let i=0;i<m.spots.length;i++){
      const sp=m.spots[i];
      ctx.beginPath();
      ctx.arc(sx+Math.cos(sp.angle)*sp.dist,sy-2+Math.sin(sp.angle)*sp.dist,1.5,0,Math.PI*2);
      ctx.fill();
    }
  }

  ctx.strokeStyle='#2a6020';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(sx,sy-2,m.w/2,Math.PI,Math.PI*2);ctx.stroke();

  if(m.hp<4){
    ctx.fillStyle='#ff4444';
    for(let i=0;i<4-m.hp;i++){
      ctx.beginPath();ctx.arc(sx-3+i*3,sy+m.h/2+2,1.5,0,Math.PI*2);ctx.fill();
    }
  }

  ctx.shadowBlur=0;
}

function drawShip(s,ox){
  const sx=ox+s.x, sy=OY+s.y;

  // Blink when invincible
  if(invincibleTimer>0&&Math.floor(invincibleTimer/4)%2===0)return;

  ctx.shadowColor='#2a6aaa';ctx.shadowBlur=10;
  ctx.fillStyle='#2a6aaa';
  ctx.beginPath();ctx.moveTo(sx-12,sy+10);ctx.lineTo(sx-8,sy);ctx.lineTo(sx+8,sy);ctx.lineTo(sx+12,sy+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#44aaff';
  ctx.beginPath();ctx.moveTo(sx-3,sy-4);ctx.lineTo(sx+3,sy-4);ctx.lineTo(sx+2,sy+2);ctx.lineTo(sx-2,sy+2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#88ccff';
  ctx.beginPath();ctx.arc(sx,sy-2,1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a4a8a';ctx.fillRect(sx-12,sy+6,5,4);ctx.fillRect(sx+7,sy+6,5,4);
  const enginePulse=Math.sin(performance.now()/100)*2;
  ctx.fillStyle='#ff8844';
  ctx.beginPath();ctx.arc(sx-5,sy+10,2+enginePulse/2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+5,sy+10,2+enginePulse/2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffaa22';
  const flameLen=3+enginePulse;
  ctx.beginPath();ctx.moveTo(sx-6,sy+10);ctx.lineTo(sx-4,sy+10+flameLen);ctx.lineTo(sx-2,sy+10);ctx.fill();
  ctx.beginPath();ctx.moveTo(sx+2,sy+10);ctx.lineTo(sx+4,sy+10+flameLen);ctx.lineTo(sx+6,sy+10);ctx.fill();
  ctx.strokeStyle='#44aaff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(sx-12,sy+10);ctx.lineTo(sx-8,sy);ctx.lineTo(sx+8,sy);ctx.lineTo(sx+12,sy+10);ctx.stroke();
  ctx.shadowBlur=0;
}

function drawParticles(ox){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];ctx.globalAlpha=p.life/35;
    ctx.shadowColor=p.color;ctx.shadowBlur=4;
    ctx.fillStyle=p.color;
    // Convert field-relative to screen coords
    ctx.beginPath();ctx.arc(ox+p.x,OY+p.y,p.size/2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function drawFloatText(ox){
  for(let i=0;i<floatText.length;i++){
    const ft=floatText[i];ctx.globalAlpha=Math.min(1,ft.life/20);
    ctx.shadowColor=ft.color;ctx.shadowBlur=6;
    ctx.fillStyle=ft.color;ctx.font='bold 11px monospace';
    // Convert field-relative to screen coords
    for(let j=0;j<ft.text.length;j++){ctx.fillText(ft.text[j],ox+ft.x,OY+ft.y-j*13);}
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

// === Background grid pattern (arcade authentic) ===
function drawBackground(ox){
  ctx.strokeStyle='rgba(30,60,30,0.3)';ctx.lineWidth=1;
  for(let x=ox;x<ox+FIELD_W;x+=20){ctx.beginPath();ctx.moveTo(x,OY);ctx.lineTo(x,H-OY);ctx.stroke();}
  for(let y=OY;y<H-OY;y+=20){ctx.beginPath();ctx.moveTo(ox,y);ctx.lineTo(ox+FIELD_W,y);ctx.stroke();}
  ctx.fillStyle='rgba(40,80,40,0.2)';
  for(let x=ox;x<ox+FIELD_W;x+=20){for(let y=OY;y<H-OY;y+=20){ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();}}
}

// === Bullet drawing with glow effect (field-relative) ===
function drawBullet(b,ox){
  const sx=ox+b.x, sy=OY+b.y;
  ctx.shadowColor='#ffa020';ctx.shadowBlur=8;
  ctx.fillStyle='#ffa020';ctx.fillRect(sx-1,sy,3,6);
  ctx.fillStyle='#ffff88';ctx.fillRect(sx,sy+1,1,4);
  ctx.globalAlpha=0.5;ctx.fillStyle='#ff8844';ctx.fillRect(sx,sy+6,1,3);
  ctx.globalAlpha=0.25;ctx.fillStyle='#ff6622';ctx.fillRect(sx,sy+9,1,2);
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

// === Field border with glow effect ===
function drawFieldBorder(ox){
  ctx.strokeStyle='#336633';ctx.lineWidth=2;ctx.strokeRect(ox,OY,FIELD_W,H-OY*2);
  ctx.strokeStyle='rgba(50,100,50,0.3)';ctx.lineWidth=4;ctx.strokeRect(ox+1,OY+1,FIELD_W-2,H-OY*2-2);
  ctx.fillStyle='#448844';const cs=6;
  ctx.fillRect(ox,OY,cs,cs);ctx.fillRect(ox+FIELD_W-cs,OY,cs,cs);
  ctx.fillRect(ox,H-OY-cs,cs,cs);ctx.fillRect(ox+FIELD_W-cs,H-OY-cs,cs,cs);
}

// === HUD with arcade styling ===
function drawHUD(){
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText('SCORE '+score,12,OY-8);
  ctx.fillStyle='#4a8';ctx.font='bold 12px monospace';
  for(let i=0;i<lives;i++){ctx.fillText('\u2665',12+i*16,OY+8);}
  ctx.fillStyle='#4f4';ctx.font='bold 12px monospace';ctx.fillText('WAVE '+wave,W-70,OY-8);
  // Display actual high score
  ctx.fillStyle='#ff0';ctx.font='bold 10px monospace';ctx.fillText('HI '+highScore,W-80,OY+8);
}

// === Attract/start screen ===
function drawAttract(){
  ctx.fillStyle='#051a0a';ctx.fillRect(0,0,W,H);
  const ox=(W-FIELD_W)/2;
  drawBackground(ox);drawFieldBorder(ox);

  // Title with glow
  const t=performance.now()/300;
  const pulse=Math.sin(t)*0.2+0.8;
  ctx.shadowColor='#4f4';ctx.shadowBlur=15*pulse;
  ctx.fillStyle='#4f4';ctx.font='bold 28px monospace';
  const title='CENTIPEDE',tw=ctx.measureText(title).width;
  ctx.fillText(title,W/2-tw/2,H*0.3);

  // Subtitle
  ctx.shadowBlur=5;ctx.fillStyle='#8f8';ctx.font='bold 12px monospace';
  const sub='ARCADE CLASSIC',sw=ctx.measureText(sub).width;
  ctx.fillText(sub,W/2-sw/2,H*0.3+35);

  // Instructions
  ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='10px monospace';
  const lines=['ARROW KEYS: MOVE','SPACE: FIRE','','TOUCH CONTROLS ON MOBILE'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2-ctx.measureText(l).width/2,H*0.48+i*18));

  // High score
  if(highScore>0){
    ctx.fillStyle='#ff0';ctx.font='bold 12px monospace';
    const hs='HIGH SCORE: '+highScore,hsw=ctx.measureText(hs).width;
    ctx.fillText(hs,W/2-hsw/2,H*0.7);
  }

  // Blinking start prompt
  const blink=Math.sin(performance.now()/250)>0;
  if(blink){
    ctx.shadowColor='#ff4';ctx.shadowBlur=8;
    ctx.fillStyle='#ff4';ctx.font='bold 14px monospace';
    const start='TAP OR PRESS SPACE',startw=ctx.measureText(start).width;
    ctx.fillText(start,W/2-startw/2,H*0.85);
  }
  ctx.shadowBlur=0;
}

// === Wave clear message with animation ===
function drawWaveClear(){
  if(waveClearMsg&&waveClearFrames>0){
    const pulse=Math.sin(performance.now()/100)*5;
    ctx.shadowColor='#4f4';ctx.shadowBlur=10+pulse;
    ctx.fillStyle='#4f4';ctx.font='bold 20px monospace';
    const tw=ctx.measureText(waveClearMsg).width;
    ctx.fillText(waveClearMsg,W/2-tw/2,H/2-30);
    ctx.shadowBlur=5;ctx.fillStyle='#8f8';ctx.font='bold 12px monospace';
    const sub='ALL CLEAR!';const sw=ctx.measureText(sub).width;
    ctx.fillText(sub,W/2-sw/2,H/2-10);
    ctx.shadowBlur=0;
  }

  if(nextWaveDelay>0){
    const blink=Math.sin(performance.now()/200)>0;
    if(blink){
      ctx.shadowColor='#ff4';ctx.shadowBlur=8;
      ctx.fillStyle='#ff4';ctx.font='bold 16px monospace';
      const nw='NEXT WAVE...';const nw2=ctx.measureText(nw).width;
      ctx.fillText(nw,W/2-nw2/2,H/2);
      ctx.shadowBlur=0;
    }
  }
}

// === Game over screen with arcade styling ===
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.shadowColor='#f66';ctx.shadowBlur=15;
  ctx.fillStyle='#f66';ctx.font='bold 28px monospace';
  const goText='GAME OVER',goW=ctx.measureText(goText).width;
  ctx.fillText(goText,W/2-goW/2,H/2-40);
  ctx.shadowColor='#ff0';ctx.shadowBlur=8;
  ctx.fillStyle='#ff0';ctx.font='bold 14px monospace';
  const scText='SCORE: '+score,scW=ctx.measureText(scText).width;
  ctx.fillText(scText,W/2-scW/2,H/2);
  ctx.shadowColor='#4f4';ctx.shadowBlur=5;
  ctx.fillStyle='#4f4';ctx.font='bold 12px monospace';
  const wvText='WAVE: '+wave,wvW=ctx.measureText(wvText).width;
  ctx.fillText(wvText,W/2-wvW/2,H/2+25);

  // Show high score on game over
  if(score>=highScore&&score>0){
    ctx.fillStyle='#ff0';ctx.font='bold 14px monospace';
    const nh='NEW HIGH SCORE!',nhw=ctx.measureText(nh).width;
    ctx.fillText(nh,W/2-nhw/2,H/2+50);
  }

  const blink=Math.sin(performance.now()/300)>0;
  if(blink){ctx.shadowBlur=0;ctx.fillStyle='#888';ctx.font='10px monospace';
    const rt='PRESS SPACE OR TAP',rtW=ctx.measureText(rt).width;
    ctx.fillText(rt,W/2-rtW/2,H/2+75);}
  ctx.shadowBlur=0;
}

// === Collision detection (all field-relative) ===
function checkCollisions(){
  // Bullet-mushroom collisions (bullets destroy mushrooms)
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];let bulletHit=false;

    // Check mushrooms first
    for(let mi=mushrooms.length-1;mi>=0&&!bulletHit;mi--){
      const m=mushrooms[mi];
      if(Math.hypot(b.x-m.x,b.y-m.y)<m.w/2+3){
        bullets.splice(bi,1);bulletHit=true;
        m.hp--;playSound('mushroom');
        if(m.hp<=0){
          addParticles(m.x,m.y,'#3a8030',6);
          mushrooms.splice(mi,1);
        }else{m.w*=0.8;m.h*=0.8;}
      }
    }
    if(bulletHit)continue;

    // Bullet-centipede collisions
    for(let ci=0;ci<centipedes.length&&!bulletHit;ci++){
      const c=centipedes[ci];
      for(let sk=c.segs.length-1;sk>=0;sk--){
        const seg=c.segs[sk];
        if(b.x>seg.x-seg.w/2&&b.x<seg.x+seg.w/2&&
           b.y>seg.y-seg.h/2&&b.y<seg.y+seg.h/2){
          bullets.splice(bi,1);bulletHit=true;

          if(c.segs.length===1){
            score+=200;addParticles(seg.x,seg.y,'#ff4422',15);
            addFloatText(seg.x,seg.y,['BONUS!','+200'],'#ff0');
            centipedes.splice(ci,1);playSound('explode');
          }else if(sk===0){
            score+=50;addParticles(seg.x,seg.y,'#ff4422',10);
            addFloatText(seg.x,seg.y,['HEAD!','+50'],'#f84');
            c.segs.splice(0,1);
            const newTrail=[];for(let i=0;i<c.segs.length*3+10;i++)newTrail.push({x:c.segs[0].x,y:c.segs[0].y});
            // Tail continues in SAME direction (not reversed)
            centipedes.push({segs:c.segs.slice(),dirX:c.dirX,speed:c.speed,mushCooldown:0,trail:newTrail});
            c.segs=[];playSound('hit');
          }else{
            score+=10;addParticles(seg.x,seg.y,'#cc3311',8);
            addFloatText(seg.x,seg.y,'+10','#ff8');
            // Split: front keeps head + segments before hit, tail is segments after
            const front=c.segs.splice(0,sk);
            const tail=c.segs.slice(); // copy remaining segments after splice
            if(tail.length>0){
              const newTrail=[];for(let i=0;i<tail.length*3+10;i++)newTrail.push({x:tail[0].x,y:tail[0].y});
              // Tail continues in SAME direction (not reversed)
              centipedes.push({segs:tail,dirX:c.dirX,speed:c.speed,mushCooldown:0,trail:newTrail});
            }
            // Speed up remaining front centipede when body is hit
            c.speed*=1.08;playSound('hit');
          }
          break;
        }
      }
    }
  }

  // Clean up empty centipedes
  for(let i=centipedes.length-1;i>=0;i--){if(centipedes[i].segs.length===0)centipedes.splice(i,1);}

  // Ship-centipede collision with invincibility check (all field-relative)
  if(ship&&!gameOver&&invincibleTimer<=0){
    for(let ci=0;ci<centipedes.length;ci++){
      const c=centipedes[ci];let hit=false;
      for(let si=0;si<c.segs.length&&!hit;si++){
        const seg=c.segs[si];
        // Distance-based check: centipedes approach from above, so use generous hitbox
        if(Math.hypot(ship.x-seg.x,ship.y-seg.y)<24){hit=true;}
      }
      if(hit){
        lives--;addParticles(ship.x,ship.y,'#2a6aaa',12);playSound('hurt');
        // Don't remove entire centipede - just reverse it and push up
        c.dirX*=-1;
        for(let si=0;si<c.segs.length;si++)c.segs[si].y-=20;
        // Grant invincibility frames (2 seconds = 120 frames)
        invincibleTimer=120;
        if(lives<=0){gameOver=true;}
        else ship={x:FIELD_W/2,y:H-OY-30};
      }
    }
  }
}

// === Wave management ===
function checkWaveClear(){
  if(centipedes.length===0&&waveClearMsg===''&&nextWaveDelay===0&&!gameOver){
    waveClearMsg='WAVE CLEAR!';waveClearFrames=120;playSound('waveclear');
    // Bonus points for remaining mushrooms
    const mushBonus=mushrooms.length*10;
    if(mushBonus>0){score+=mushBonus;addFloatText(FIELD_W/2,(H-OY)/2,['MUSH BONUS','+'+mushBonus],'#4f4');}
  }
}

function updateWaveTransition(){
  if(waveClearFrames>0){waveClearFrames--;return;}
  // Set nextWaveDelay after wave clear message finishes
  if(nextWaveDelay>0){nextWaveDelay--;if(nextWaveDelay===0)spawnNextWave();}
  else if(waveClearFrames===0&&waveClearMsg!==''){nextWaveDelay=90;waveClearMsg='';}
}

function spawnNextWave(){
  wave++;
  const numCentipedes=Math.min(wave,5);
  for(let i=0;i<numCentipedes;i++)spawnCenti();
}

// === Particle and float text updates ===
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    p.vx*=0.95;p.vy*=0.95;
    if(p.life<=0)particles.splice(i,1);
  }
}

function updateFloatText(){
  for(let i=floatText.length-1;i>=0;i--){
    const ft=floatText[i];ft.y+=ft.vy;ft.life--;
    if(ft.life<=0)floatText.splice(i,1);
  }
}

// === Main game loop ===
function loop(){
  ctx.fillStyle='#051a0a';ctx.fillRect(0,0,W,H);
  const ox=(W-FIELD_W)/2;

  // Handle attract state
  if(gameState==='attract'){drawAttract();requestAnimationFrame(loop);return;}

  // Handle game over state
  if(gameOver){
    drawBackground(ox);
    for(let i=0;i<mushrooms.length;i++)drawMush(mushrooms[i],ox);
    for(let i=0;i<centipedes.length;i++)drawCenti(centipedes[i],ox);
    drawFieldBorder(ox);drawGameOver();
    // Save high score on game over
    if(score>highScore){highScore=score;localStorage.setItem('centipede_highscore',highScore);}
    gameState='gameover';
    requestAnimationFrame(loop);return;
  }

  // Ship movement (field-relative)
  if(keys.left)ship.x=Math.max(12,ship.x-6);
  if(keys.right)ship.x=Math.min(FIELD_W-12,ship.x+6);

  // Fire rate with cooldown timer (hold to fire)
  if(keys.fire){
    if(fireTimer<=0){
      if(bullets.length<5){bullets.push({x:ship.x,y:ship.y-8,dy:-10});fireTimer=FIRE_COOLDOWN;playSound('shoot');}
    }
  }
  if(fireTimer>0)fireTimer--;

  // Update centipedes
  for(let i=centipedes.length-1;i>=0;i--)updateCenti(centipedes[i]);

  // Update bullets (field-relative)
  for(let i=bullets.length-1;i>=0;i--){bullets[i].y+=bullets[i].dy;if(bullets[i].y<-10)bullets.splice(i,1);}

  // Check collisions
  checkCollisions();

  // Update invincibility timer
  if(invincibleTimer>0)invincibleTimer--;

  // Extra life every 10000 points
  if(score-extraLifeScore>=10000){extraLifeScore+=10000;lives=Math.min(lives+1,9);addFloatText(ship.x,ship.y-20,['EXTRA LIFE!'],'#4f4');playSound('waveclear');}

  // Update effects
  updateParticles();updateFloatText();

  // Wave management
  checkWaveClear();updateWaveTransition();

  // Draw everything (layered) - all use ox for x-offset, OY for y-offset
  drawBackground(ox);
  for(let i=0;i<mushrooms.length;i++)drawMush(mushrooms[i],ox);
  for(let i=0;i<centipedes.length;i++)drawCenti(centipedes[i],ox);
  for(let i=0;i<bullets.length;i++)drawBullet(bullets[i],ox);
  if(ship)drawShip(ship,ox);
  drawFieldBorder(ox);
  drawParticles(ox);drawFloatText(ox);
  drawHUD();drawWaveClear();

  requestAnimationFrame(loop);
}

// === Start in attract mode ===
window.addEventListener('load',function(){resize();gameState='attract';setTimeout(function(){loop();},300);});
if(document.readyState==='complete'){resize();gameState='attract';setTimeout(function(){loop();},300);}
</script>
