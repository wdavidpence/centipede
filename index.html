<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Centipede</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Courier New",monospace}
canvas{display:block;width:100%;height:100%}
#debug{position:fixed;top:0;left:0;background:rgba(0,0,0,.8);color:#0f0;font-size:10px;padding:4px;z-index:10;white-space:pre;line-height:1.3;display:none}
.btn{position:fixed;z-index:5;width:76px;height:76px;border-radius:50%;background:rgba(10,30,20,.8);color:#8f9;font-size:24px;display:none;align-items:center;justify-content:center}
.left{left:12px;bottom:24px}.right{left:104px;bottom:24px}.fire{right:12px;bottom:24px}
@media(pointer:coarse){.btn{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="btn left">&#9664;</div>
<div class="btn right">&#9654;</div>
<div class="btn fire">&#8226;</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

let W,H,ship,bullets=[],centipedes=[],mushrooms=[],scorpions=[],saucers=[],spiders=[],saucerBullets=[];
let score=0,lives=3,wave=1,gameOver=false;
let keys={left:false,right:false,fire:false};
let particles=[],floatText=[];
let waveClearMsg='',waveClearFrames=0,nextWaveDelay=0;

// CRT visual engine
let screenShakeX=0,screenShakeY=0,screenShakeDecay=0;
let impactFlash=0;
let scanlineCanvas,scanlineCtx,scanlinePattern;
let crtOffscreen,crtCtx2d; // Offscreen buffer for CRT barrel distortion
let crtTurnOnProgress=1; // 1=fully on, animates from 0 when game starts
let crtPowerOffProgress=0; // 1=fully off (black line), animates from 0 on game over

function triggerShake(intensity){screenShakeDecay=intensity||5;}
function triggerFlash(frames){impactFlash=frames||8;}

// Game state machine
let gameState='attract'; // 'attract','playing','gameover'

// Invincibility frames after losing a life
let invincibleTimer=0;

// High score persistence
let highScore=parseInt(localStorage.getItem('centipede_highscore')||'0');

// Extra life tracking
let extraLifeScore=0;

// Configuration - all coordinates are FIELD-RELATIVE (origin at top-left of play area)
const FIELD_W=240; // Game logic always runs at this reference width
const FIELD_H=500; // Fixed field height in game coords
const GRID_COLS=30;
const GRID_ROWS=28;

// Fire rate config
const FIRE_COOLDOWN=5;
let fireTimer=0;
let muzzleFlash=0;

// Field offset (where the play area starts on screen)
const OY=30; // top margin for HUD

// Dynamic scale and offset computed from screen size
let SCALE=1,OX=0;

function resize(){
  W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;
  // Scale field to fit screen with some margins
  const availW=W-40, availH=H-OY*2;
  SCALE=Math.min(availW/FIELD_W, availH/FIELD_H, 4); // max 4x
  OX=(W-FIELD_W*SCALE)/2;
  // Generate scanline pattern
  if(!scanlineCanvas){scanlineCanvas=document.createElement('canvas');scanlineCtx=scanlineCanvas.getContext('2d');}
  scanlineCanvas.width=W;scanlineCanvas.height=H;
  for(let y=0;y<H;y+=2){
    // Subtle scanline hum: slight brightness variation (real CRT power supply ripple)
    const humAlpha=0.12+Math.sin(y*0.05)*0.03;
    scanlineCtx.fillStyle=`rgba(0,0,0,${humAlpha})`;scanlineCtx.fillRect(0,y,W,1);
  }
  scanlinePattern=scanlineCtx.createPattern(scanlineCanvas,'repeat');
  // Offscreen buffer for barrel distortion
  if(!crtOffscreen){crtOffscreen=document.createElement('canvas');crtCtx2d=crtOffscreen.getContext('2d');}
  crtOffscreen.width=W;crtOffscreen.height=H;
}
window.addEventListener('resize',function(){
  resize();
  if(ship&&gameState==='playing'){
    ship.y=FIELD_H-30; // keep ship at field bottom
  }
});

// === Audio engine ===
let audioCtx=null;
function getAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}

function playSound(type){
  try{
    const ac=getAudio();if(!ac)return;
    const now=ac.currentTime;
    // TMS9919-style: 3 voice square waves + noise generator, limited to 8 frequencies per channel
    // We simulate with oscillators + noise buffer + low-pass filter for authentic chip sound
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4000;
    lp.connect(ac.destination);
    if(type==='shoot'){
      // TMS9919: noise burst (channel D), very short, bright
      const bufSize=ac.sampleRate*0.04;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1);
      const s=ac.createBufferSource();const g=ac.createGain();s.buffer=buf;
      g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.04);
      s.connect(g).connect(lp);s.start(now);
    }else if(type==='explode'){
      // TMS9919: noise sweep + descending tone
      const bufSize=ac.sampleRate*0.5;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,1.5);
      const s=ac.createBufferSource();const g=ac.createGain();s.buffer=buf;
      g.gain.setValueAtTime(0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.5);
      s.connect(g).connect(lp);s.start(now);
      // Add descending tone layer
      const o=ac.createOscillator();const g2=ac.createGain();o.type='square';
      o.frequency.setValueAtTime(400,now);o.frequency.exponentialRampToValueAtTime(60,now+0.5);
      g2.gain.setValueAtTime(0.15,now);g2.gain.exponentialRampToValueAtTime(0.001,now+0.5);
      o.connect(g2).connect(lp);o.start(now);o.stop(now+0.5);
    }else if(type==='hit'){
      // TMS9919: short square wave blip with pitch drop
      const o=ac.createOscillator();const g=ac.createGain();o.type='square';
      o.frequency.setValueAtTime(600,now);o.frequency.exponentialRampToValueAtTime(150,now+0.08);
      g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.08);
      o.connect(g).connect(lp);o.start(now);o.stop(now+0.08);
    }else if(type==='waveclear'){
      // TMS9919: ascending arpeggio (major chord, 3 voices)
      [523,659,784,1047].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='square';o.frequency.value=f;
        g.gain.setValueAtTime(0.1,now+i*0.15);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.15+0.25);
        o.connect(g).connect(lp);o.start(now+i*0.15);o.stop(now+i*0.15+0.27);
      });
    }else if(type==='gameover'){
      // TMS9919: descending chromatic scale with noise undertone
      [400,350,300,250,200].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='square';o.frequency.value=f;
        g.gain.setValueAtTime(0.15,now+i*0.35);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.35+0.3);
        o.connect(g).connect(lp);o.start(now+i*0.35);o.stop(now+i*0.35+0.32);
      });
    }else if(type==='hurt'){
      // TMS9919: descending square wave + noise for player death
      const o=ac.createOscillator();const g=ac.createGain();o.type='square';
      o.frequency.setValueAtTime(400,now);o.frequency.exponentialRampToValueAtTime(50,now+0.4);
      g.gain.setValueAtTime(0.2,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);
      o.connect(g).connect(lp);o.start(now);o.stop(now+0.4);
      const bufSize=ac.sampleRate*0.3;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
      const s=ac.createBufferSource();const g2=ac.createGain();s.buffer=buf;
      g2.gain.setValueAtTime(0.1,now);g2.gain.exponentialRampToValueAtTime(0.001,now+0.3);
      s.connect(g2).connect(lp);s.start(now);
    }else if(type==='mushroom'){
      // TMS9919: short high square blip (mushroom damage)
      const o=ac.createOscillator();const g=ac.createGain();o.type='square';
      o.frequency.setValueAtTime(1200,now);o.frequency.exponentialRampToValueAtTime(400,now+0.04);
      g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.04);
      o.connect(g).connect(lp);o.start(now);o.stop(now+0.04);
    }else if(type==='bonus'){
      // TMS9919: ascending fanfare (E-G-B-D), quick notes
      [784,988,1175,1568].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='square';o.frequency.value=f;
        g.gain.setValueAtTime(0.15,now+i*0.06);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.06+0.1);
        o.connect(g).connect(lp);o.start(now+i*0.06);o.stop(now+i*0.06+0.12);
      });
    }
  }catch(e){}
}

// === Utility functions - all use field-relative coords, convert to screen in draw ===
function addParticles(fx,fy,color,count,spread){
  // If color is a string, use it; if it's an array, cycle through colors (multi-color explosions)
  const colors=Array.isArray(color)?color:[color];
  // spread: how fast particles fly outward (default 4)
  const s = spread || 4;
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = (Math.random()*0.7+0.3)*s;
    particles.push({x:fx,y:fy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:20+Math.random()*15,color:colors[i%colors.length],size:1.5+Math.random()*2});
  }
}

function addFloatText(fx,fy,text,color){
  floatText.push({x:fx,y:fy,text:typeof text==='string'?[text]:text,color:color||'#ff0',life:60,vy:-1});
}

// === Input handling ===
document.addEventListener('keydown',function(e){
  if(gameState==='attract'&&(e.key===' '||e.key==='Enter')){
    e.preventDefault();getAudio();startGame();return;
  }
  if(gameState==='gameover'&&e.key===' '){startGame();return;}
  if(e.key==='ArrowLeft')keys.left=true;
  if(e.key==='ArrowRight')keys.right=true;
  if(e.key==='ArrowUp')keys.up=true;
  if(e.key==='ArrowDown')keys.down=true;
  if(e.key===' ')keys.fire=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')keys.left=false;
  if(e.key==='ArrowRight')keys.right=false;
  if(e.key==='ArrowUp')keys.up=false;
  if(e.key==='ArrowDown')keys.down=false;
  if(e.key===' ')keys.fire=false;
});

document.querySelector('.btn.left').addEventListener('touchstart',function(e){e.preventDefault();keys.left=true;},{passive:false});
document.querySelector('.btn.left').addEventListener('touchend',function(e){e.preventDefault();keys.left=false;},{passive:false});
document.querySelector('.btn.right').addEventListener('touchstart',function(e){e.preventDefault();keys.right=true;},{passive:false});
document.querySelector('.btn.right').addEventListener('touchend',function(e){e.preventDefault();keys.right=false;},{passive:false});
document.querySelector('.btn.fire').addEventListener('touchstart',function(e){e.preventDefault();keys.fire=true;},{passive:false});
document.querySelector('.btn.fire').addEventListener('touchend',function(e){e.preventDefault();keys.fire=false;},{passive:false});

// Touch/click to start from attract screen
canvas.addEventListener('touchstart',function(e){
  if(gameState==='attract'){e.preventDefault();getAudio();startGame();return;}
  if(gameState==='gameover'){e.preventDefault();startGame();}
},{passive:false});
canvas.addEventListener('click',function(e){
  if(gameState==='attract'){getAudio();startGame();return;}
  if(gameState==='gameover'){startGame();}
});

// === Game initialization ===
function startGame(){
  score=0;lives=3;wave=1;gameOver=false;
  bullets=[];centipedes=[];mushrooms=[];scorpions=[];saucers=[];spiders=[];fleas=[];particles=[];floatText=[];
  waveClearMsg='';waveClearFrames=0;nextWaveDelay=0;
  invincibleTimer=0;fireTimer=0;extraLifeScore=0;saucerTimer=0;fleaTimer=0;
  // Ship position: field-relative (bottom of play area)
  ship={x:FIELD_W/2,y:FIELD_H-30};
  spawnMush();spawnCenti();
  crtTurnOnProgress=0; // Trigger CRT turn-on animation
  crtPowerOffProgress=0;
  gameState='playing';
}

// === Centipede spawning (field-relative) ===
function spawnCenti(offset){
  offset=offset||0;
  const segCount=Math.min(15+wave*2,26); // 15 on wave 1, +2 per wave, max 26
  const fromLeft=(wave%2===1);
  const dirX=fromLeft?1:-1;
  const startX=fromLeft?-8:FIELD_W+8;
  // Original: odd waves fast, even waves slow (with slight wave-based scaling)
  const isFastWave = (wave % 2 === 1);
  const baseSpeed = isFastWave ? 2.0 : 0.75;
  const waveBoost = Math.min(wave * 0.05, 0.5);
  const spd = baseSpeed + waveBoost;
  const segGap=9;

  // All segments start on the same row, spread horizontally behind entry point
  const spawnY=5+offset;
  const segs=[];
  for(let i=0;i<segCount;i++){
    segs.push({x:startX-i*segGap*dirX,y:spawnY,w:8,h:6});
  }
  // Pre-fill trail behind the centipede so body segments have history to follow
  const trail=[];
  for(let i=0;i<segCount*3+10;i++){
    trail.push({x:startX-i*segGap*dirX,y:spawnY});
  }
  centipedes.push({segs,dirX,speed:spd,trail});
}

function spawnMush(){
  // Grid-based mushroom placement for authentic ~65% density
  const cellW=FIELD_W/GRID_COLS;
  const cellH=(FIELD_H-60)/GRID_ROWS; // leave room for HUD and player zone
  const startY=35;

  for(let r=0;r<GRID_ROWS-3;r++){ // leave bottom 3 rows clear for player
    for(let c=0;c<GRID_COLS;c++){
      // Seeded random: ~65% fill, with some empty spaces for movement paths
      let seed=r*GRID_COLS+c+42;
      seed=(seed*1103515245+12345)&0x7fffffff;
      if((seed%100)<65){
        const spots=[];
        for(let s=0;s<3;s++){
          seed=(seed*1103515245+12345)&0x7fffffff;
          const angle=Math.PI+(seed%360)/360*Math.PI;
          seed=(seed*1103515245+12345)&0x7fffffff;
          const dist=cellW*0.3+s*1.2;
          spots.push({angle,dist});
        }
        // Mushroom variety: different cap shapes based on grid position
        const mushType=(seed%3); // 0=round, 1=wide, 2=tall
        let mw=mushType===1?cellW*0.9:cellW*0.75;
        let mh=mushType===2?cellH*1.0:cellH*0.85;
        mushrooms.push({x:c*cellW+cellW/2,y:startY+r*cellH,w:mw,h:mh,hp:4,spots,centiHitTimer:0,mushType});
      }
    }
  }
}

// === Centipede update (field-relative) ===
function updateCenti(c){
  const head=c.segs[0];

  // Record head's current position in trail buffer (before moving)
  if(!c.trail)c.trail=[];
  c.trail.unshift({x:head.x,y:head.y});
  if(c.trail.length>c.segs.length*3+20)c.trail.pop();

  // Move head horizontally only
  head.x+=c.dirX*c.speed;

  // Mushroom collision - reverse direction and drop down when head hits a mushroom
  let hitMush=false;
  for(let i=0;i<mushrooms.length&&!hitMush;i++){
    const m=mushrooms[i];
    if(Math.hypot(head.x-m.x,head.y-m.y)<m.w/2+4){
      c.dirX*=-1;
      head.y+=18; // drop one grid row
      hitMush=true;
    }
  }

  // Wall bounce - reverse and drop down at actual field edges
  if(head.x<2){head.x=2;c.dirX=1;head.y+=18;}
  else if(head.x>FIELD_W-2){head.x=FIELD_W-2;c.dirX=-1;head.y+=18;}

  // Body segments follow trail with fixed spacing - no independent mushroom logic or squirm
  for(let i=1;i<c.segs.length;i++){
    const trailIdx=i*2;
    if(trailIdx<c.trail.length){
      c.segs[i].x=c.trail[trailIdx].x;
      c.segs[i].y=c.trail[trailIdx].y;
    }else{
      // If trail is too short, position behind previous segment
      const prev=c.segs[i-1];
      c.segs[i].x=prev.x-c.dirX*8;
      c.segs[i].y=prev.y;
    }
  }

  // Only head damages mushrooms, with cooldown per mushroom
  const seg=c.segs[0];
  for(let mi=mushrooms.length-1;mi>=0;mi--){
    const m=mushrooms[mi];
    if(Math.hypot(seg.x-m.x,seg.y-m.y)<m.w/2+4){
      if(!m.centiHitTimer||m.centiHitTimer<=0){
        m.hp--;if(m.hp<=0){mushrooms.splice(mi,1);addParticles(m.x,m.y,['#3a8030','#4a9040','#6ab050'],10);}else{m.w*=0.75;m.h*=0.75;addParticles(m.x,m.y,['#3a8030','#4a9040'],4);}
        m.centiHitTimer=30; // 30-frame cooldown per mushroom
      }
    }
    if(m.centiHitTimer)m.centiHitTimer--;
  }

  // Body segments reaching bottom become mushrooms
  for(let i=c.segs.length-1;i>=1;i--){
    const fieldBottom=FIELD_H-20;
    if(c.segs[i].y>fieldBottom){
      const fallen=c.segs.splice(i,1)[0];
      // Create a new mushroom with growth animation (starts small, grows to full size)
      mushrooms.push({x:fallen.x,y:fieldBottom-5,w:4,h:5,hp:4,spots:[],centiHitTimer:0,growProgress:0});
      addParticles(fallen.x,fallen.y,'#3a8030',6);
    }
  }

  // Game over check: field-relative bottom of play area
  const fieldBottom=FIELD_H-20; // field height minus margin
  if(head.y>fieldBottom){gameOver=true;crtPowerOffProgress=0;}
}

// === Scorpion mechanics ===
// Scorpions emerge from centipede heads when shot. They seek the player while
// avoiding mushrooms. In the original, they appear after a delay (head stays
// on screen as a "cocoon" then the scorpion bursts out).

function spawnScorpion(x,y){
  // Scorpion emerges after a brief delay (cocoon phase)
  scorpions.push({
    x, y,
    w:10, h:8,
    speed:1.8 + Math.min(wave*0.15, 1.2), // scorpion ~1.8-3px/frame (scales with wave)
    state: 'cocoon', // 'cocoon','emerging','moving'
    timer: 75, // frames before emerging (1.25 seconds)
    dirX: (Math.random()>0.5?1:-1),
    dirY: 1,
    pauseTimer: 0,
    animPhase: Math.random()*Math.PI*2
  });
}

function updateScorpion(s){
  if(s.state==='cocoon'){
    s.timer--;
    // Cocoon grows slightly as scorpion prepares to emerge
    if(s.timer<=15){
      s.emergeScale=1+(15-s.timer)*0.1; // pulse up to 2.5x
    }
    if(s.timer<=0){
      s.state='emerging';
      s.timer=15; // brief emergence animation (longer for more drama)
      s.emergeScale=1;
    }
    return;
  }

  if(s.state==='emerging'){
    s.timer--;
    s.emergeScale=1+(15-s.timer)*0.2; // expand from 1x to 4x during burst
    if(s.timer<=0){
      s.state='moving';
    }
    return;
  }

  // Moving state - seek player with mushroom avoidance
  if(s.pauseTimer>0){s.pauseTimer--;return;}

  // Target: player position (field-relative)
  const targetX=ship.x; // seek player directly
  const targetY=ship.y;

  // Calculate direction toward player
  const dx=targetX-s.x;
  const dy=targetY-s.y;
  const dist=Math.hypot(dx,dy);

  if(dist>5){
    // Normalize direction
    const ndx=dx/dist;
    const ndy=dy/dist;

    // Scorpions move diagonally toward player but snap to 8 directions
    let moveX=0, moveY=0;
    if(Math.abs(ndx)>Math.abs(ndy)){
      moveX=ndx>0?1:-1;
      moveY=ndy*0.5; // slower vertical component
    }else{
      moveY=ndy>0?1:-1;
      moveX=ndx*0.5;
    }

    // Check mushroom collision at target position
    let blocked=false;
    const nextX=s.x+moveX*s.speed;
    const nextY=s.y+moveY*s.speed;
    for(let i=0;i<mushrooms.length&&!blocked;i++){
      const m=mushrooms[i];
      if(Math.hypot(nextX-m.x,nextY-m.y)<m.w/2+5){blocked=true;}
    }

    if(!blocked){
      s.x=nextX;
      s.y=nextY;
    }else{
      // Try going around - switch horizontal direction
      s.x-=s.dirX*s.speed;
      s.y+=s.speed*0.5;
      s.dirX*=-1;
      s.pauseTimer=10; // brief pause when blocked
    }
  }

  // Keep in bounds
  if(s.x<5){s.x=5;s.dirX=1;}
  if(s.x>FIELD_W-5){s.x=FIELD_W-5;s.dirX=-1;}

  // Animate
  s.animPhase+=0.15;

  // Game over if scorpion reaches bottom
  const fieldBottom=FIELD_H-20;
  if(s.y>fieldBottom){gameOver=true;crtPowerOffProgress=0;}
}

// Draw scorpion with vector-style graphics
function drawScorpion(s){
  const sx=s.x, sy=s.y;
  const t=performance.now()/150;

  if(s.state==='cocoon'){
    // Cocoon: pulsating centipede head remnant with growing glow
    const pulse=Math.sin(t*3)*4;
    const growScale=s.emergeScale||1;
    ctx.shadowColor='#ff4400';ctx.shadowBlur=10+pulse*growScale;
    ctx.strokeStyle='#ff4400';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(sx,sy,(6+pulse/2)*growScale,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(255,68,0,${0.3*growScale})`;
    ctx.fill();
    // Inner glow ring
    ctx.shadowColor='#ff8800';ctx.shadowBlur=6;
    ctx.strokeStyle='rgba(255,136,0,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(sx,sy,(4+pulse/3)*growScale,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
    return;
  }

  if(s.state==='emerging'){
    // Bursts out with particles
    const burst=15-s.timer;
    const scale=burst/15;
    ctx.shadowColor='#ff8800';ctx.shadowBlur=15*scale;
    ctx.strokeStyle='#ff8800';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,sy,8+scale*5,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
    return;
  }

  // Full scorpion - vector style with jumpy legs (matching centipede)
  const legFrame=Math.floor(performance.now()/80)%4; // 4 discrete frames
  const legPos = [0, -2, 0, 2][legFrame];

  // Movement glow trail (faint afterimage behind scorpion)
  ctx.fillStyle='rgba(255,102,0,0.08)';ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(sx-s.dirX*8,sy,8,0,Math.PI*2);ctx.fill();

  // Body glow
  ctx.shadowColor='#ff6600';ctx.shadowBlur=12;
  ctx.strokeStyle='#ff6600';ctx.lineWidth=2.5;

  // Main body (oval)
  // Subtle breathing: body size pulses slightly
  const scorpBreathe=Math.sin(performance.now()/300)*0.5;
  ctx.beginPath();ctx.ellipse(sx,sy,7+scorpBreathe*0.3,5+scorpBreathe*0.2,0,0,Math.PI*2);ctx.stroke();
  const bodyGrad=ctx.createRadialGradient(sx,sy,1,sx,sy,7);
  bodyGrad.addColorStop(0,'rgba(255,102,0,0.4)');
  bodyGrad.addColorStop(1,'rgba(255,102,0,0.1)');
  ctx.fillStyle=bodyGrad;
  ctx.fill();

  // Head (smaller oval in front)
  ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(sx,sy-6,4,3.5,0,0,Math.PI*2);ctx.stroke();

  // Tail (curved upward behind) - multi-segment
  const tailFrame=Math.floor(performance.now()/120)%4;
  const tailCurl=[-3,0,3,0][tailFrame];
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(sx,sy+5);
  ctx.quadraticCurveTo(sx+tailCurl*0.5,sy+10,sx+tailCurl,sy+13);
  ctx.quadraticCurveTo(sx+tailCurl*1.5,sy+10,sx+tailCurl*2,sy+6);
  ctx.quadraticCurveTo(sx+tailCurl*2.5,sy+3,sx+tailCurl*1.5,sy+1);
  ctx.stroke();

  // Stinger tip (bright)
  ctx.fillStyle='#ffcc00';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(sx+tailCurl*1.5,sy+1,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(sx+tailCurl*1.5,sy+1,1.2,0,Math.PI*2);ctx.fill();

  // Pincers (front) — more aggressive spread, snaps shut when near player
  const pincerFrame=Math.floor(performance.now()/100)%4;
  const distToPlayer=ship?Math.hypot(sx-ship.x,sy-ship.y):999;
  const snapShut=distToPlayer<60; // snaps shut when close to player
  const pincerOpen=snapShut?[2,3,2,3][pincerFrame]:[2,6,2,6][pincerFrame];
  ctx.strokeStyle='#ff8800';ctx.lineWidth=2;ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(sx-3,sy-9);ctx.lineTo(sx-7-pincerOpen,sy-12);
  ctx.lineTo(sx-9-pincerOpen,sy-10);
  ctx.moveTo(sx+3,sy-9);ctx.lineTo(sx+7+pincerOpen,sy-12);
  ctx.lineTo(sx+9+pincerOpen,sy-10);
  ctx.stroke();

  // Pincer tips
  ctx.fillStyle='#ffcc00';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(sx-9-pincerOpen,sy-10,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+9+pincerOpen,sy-10,1.5,0,Math.PI*2);ctx.fill();

  // Animated legs (4 pairs, jumpy 4-frame)
  ctx.strokeStyle='#ff6600';ctx.lineWidth=1.5;ctx.shadowBlur=6;
  for(let i=0;i<4;i++){
    const ly=sy-3+i*2.5;
    const iLegPos = [0, -2, 0, 2][(legFrame+i)%4];
    // Left legs (with knee joint)
    ctx.beginPath();ctx.moveTo(sx-6,ly);ctx.lineTo(sx-9-iLegPos,ly+2);ctx.lineTo(sx-11-iLegPos*1.5,ly+4);ctx.stroke();
    // Right legs (with knee joint)
    ctx.beginPath();ctx.moveTo(sx+6,ly);ctx.lineTo(sx+9+iLegPos,ly+2);ctx.lineTo(sx+11+iLegPos*1.5,ly+4);ctx.stroke();
  }

  // Eyes
  ctx.fillStyle='#fff';ctx.shadowBlur=4;
  ctx.beginPath();ctx.arc(sx-2,sy-6.5,1.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+2,sy-6.5,1.2,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
}

// === Flying Saucer mechanics ===
// Saucers appear at the top of the screen, move horizontally, and drop spiders.
// In the original, they appear from wave 3+.

let saucerTimer=0;
const SAUCER_INTERVAL=480; // spawn saucer every 8 seconds (at wave 3+)

function spawnSaucer(){
  const fromLeft=Math.random()>0.5;
  saucers.push({
    x: fromLeft?-30:FIELD_W+30,
    y: 15, // top of field
    dirX: fromLeft?(3+Math.min(wave*0.2,2)):-3-(Math.min(wave*0.2,2)),
    speed: 2.5+Math.min(wave*0.1,2),
    dropTimer: 60+Math.random()*120, // when to drop spider
    animPhase: 0,
    alive: true
  });
}

function updateSaucer(s){
  // Subtle hover bobbing (authentic Atari: saucers bob up/down slightly)
  s.bobPhase=(s.bobPhase||0)+0.08;
  s.bobY=Math.sin(s.bobPhase)*2;

  s.x+=s.dirX;
  s.animPhase+=0.1;

  // Drop spider after timer
  s.dropTimer--;
  if(s.dropTimer<=0&&spiders.length<3+Math.floor(wave/2)){
    // Drop spider at saucer position
    spiders.push({
      x: s.x,
      y: s.y+10,
      w: 10, h: 8,
      speed: 2.5+Math.min(wave*0.1,2.5),
      state: 'falling', // 'falling','jumping'
      fallSpeed: 4,
      jumpTimer: 30,
      dirX: (Math.random()>0.5?1:-1),
      animPhase: Math.random()*Math.PI*2,
      legAnim: 0
    });
    s.dropTimer=90+Math.random()*120; // cooldown before next drop
  }

  // Saucer shoots at player (original mechanic) - tuned rate
  if(!s.shootTimer)s.shootTimer=20+Math.random()*30;
  s.shootTimer--;
  if(s.shootTimer<=0){
    // Fire a bullet downward toward player
    saucerBullets.push({x:s.x, y:s.y+10, dy:3.5, life:250});
    addParticles(s.x,s.y+10,['#ffcc00','#fff'],4,2);
    s.shootTimer=50+Math.random()*70;
  }

  // Remove if off screen
  if(s.x<-50||s.x>FIELD_W+50)s.alive=false;
}

function drawSaucer(s){
  const sx=s.x, sy=s.y+(s.bobY||0);
  const t=s.animPhase;

  // Enhanced saucer: golden dome with detailed lights
  ctx.shadowColor='#ffcc00';ctx.shadowBlur=14;

  // Outer dome (larger, more detailed)
  ctx.strokeStyle='#ffcc00';ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.ellipse(sx,sy-2,18,8,0,Math.PI,0); // top dome
  ctx.stroke();

  // Pulsing rim lights around dome edge
  for(let rl=0;rl<6;rl++){
    const angle=Math.PI+rl*Math.PI/5; // distribute along dome arc
    const rx=sx+Math.cos(angle)*16;
    const ry=sy-2+Math.sin(angle)*6;
    const rpulse=Math.sin(t*4+rl*0.8)*0.5+0.5;
    ctx.fillStyle=`rgba(255,255,200,${rpulse*0.8})`;ctx.shadowColor='#fff';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(rx,ry,1.5+rpulse,0,Math.PI*2);ctx.fill();
  }

  // Dome fill with gradient
  const domeGrad=ctx.createRadialGradient(sx,sy-6,2,sx,sy-2,18);
  domeGrad.addColorStop(0,'rgba(255,230,100,0.4)');
  domeGrad.addColorStop(1,'rgba(255,204,0,0.1)');
  ctx.fillStyle=domeGrad;
  ctx.beginPath();ctx.ellipse(sx,sy-2,18,8,0,Math.PI,0);ctx.fill();

  // Specular highlight on dome (white reflection spot)
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.shadowColor='#fff';ctx.shadowBlur=8;
  ctx.beginPath();ctx.ellipse(sx-4,sy-6,5,3,-0.3,0,Math.PI*2);ctx.fill();

  // Base ring (wider)
  ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(sx,sy+2,18,4,0,0,Math.PI*2);ctx.stroke();

  // Energy ring pulse (subtle inner glow that pulses)
  const energyPulse=Math.sin(t*3)*0.3+0.5;
  ctx.strokeStyle=`rgba(255,204,0,${energyPulse*0.4})`;ctx.lineWidth=1;ctx.shadowBlur=6;
  ctx.beginPath();ctx.ellipse(sx,sy+2,14,3,0,0,Math.PI*2);ctx.stroke();

  // Cockpit window (small oval in center of disc)
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;ctx.shadowColor='#fff';ctx.shadowBlur=4;
  ctx.beginPath();ctx.ellipse(sx,sy+2,6,2,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(100,200,255,0.3)';ctx.fill();

  // Saucer underside (subtle)
  ctx.strokeStyle='rgba(255,204,0,0.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(sx,sy+4,12,3,0,0,Math.PI);ctx.stroke();

  // Center light (pulsing)
  const lightPulse=Math.sin(t*3)*0.5+0.5;
  ctx.fillStyle=`rgba(255,255,255,${0.5+lightPulse*0.5})`;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(sx,sy-4,2.5,0,Math.PI*2);ctx.fill();

  // Edge lights (3 per side)
  ctx.shadowBlur=6;
  for(let i=-1;i<=1;i++){
    const ex=sx+i*8, ey=sy-1;
    ctx.fillStyle=`rgba(255,204,0,${0.4+lightPulse*0.4})`;
    ctx.beginPath();ctx.arc(ex,ey,1.8,0,Math.PI*2);ctx.fill();
  }

  // Landing lights (bottom)
  ctx.fillStyle=`rgba(255,100,0,${0.3+lightPulse*0.3})`;
  ctx.beginPath();ctx.arc(sx-5,sy+6,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+5,sy+6,1.5,0,Math.PI*2);ctx.fill();

  

  // Shadow beneath saucer (authentic: darker spot on playfield, pulses with hover)
  const shadowPulse=Math.sin(t*3)*2+2; // shadow size pulses
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.shadowBlur=0;
  ctx.beginPath();ctx.ellipse(sx,sy+14,20+shadowPulse,4+shadowPulse*0.5,0,0,Math.PI*2);ctx.fill();

  // Engine glow underneath dome (subtle blue-white exhaust)
  const enginePulse=Math.sin(t*5)*0.3+0.5;
  ctx.fillStyle=`rgba(150,200,255,${enginePulse*0.4})`;ctx.shadowColor='#88ccff';ctx.shadowBlur=12;
  ctx.beginPath();ctx.ellipse(sx,sy+6,8,3,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.shadowBlur=0;
}

// === Spider mechanics ===
// Spiders are dropped by saucers. They jump toward the player and destroy
// mushrooms on contact. In the original, they're worth 75 points.

function updateSpider(s){
  if(s.state==='falling'){
    s.y+=s.fallSpeed;
    // Spider spins while falling (authentic)
    s.animPhase+=0.3;
    // When it reaches the field, start jumping
    if(s.y>30){
      s.state='jumping';
      s.jumpTimer=0;
      // Landing dust particles
      addParticles(s.x,s.y,['#ff00aa','#4a0040'],6,2);
    }
    return;
  }

  // Jumping state - seek player with hopping movement
  s.animPhase+=0.12;
  s.legAnim+=0.2;

  if(s.jumpTimer>0){s.jumpTimer--;return;}

  // Move toward player (field-relative)
  const dx=ship.x-s.x;
  const dy=ship.y-s.y;
  const dist=Math.hypot(dx,dy);

  if(dist>8){
    let moveX=(dx/dist)*s.speed;
    let moveY=(dy/dist)*s.speed*0.6;

    // Check mushroom collision
    let blocked=false;
    for(let i=0;i<mushrooms.length&&!blocked;i++){
      const m=mushrooms[i];
      if(Math.hypot(s.x+moveX-m.x,s.y+moveY-m.y)<m.w/2+5){blocked=true;}
    }

    if(!blocked){
      s.x+=moveX;
      s.y+=moveY;
    }else{
      s.x-=s.dirX*s.speed;
      s.dirX*=-1;
    }
  }

  // Spider destroys mushrooms on contact
  for(let mi=mushrooms.length-1;mi>=0;mi--){
    const m=mushrooms[mi];
    if(Math.hypot(s.x-m.x,s.y-m.y)<m.w/2+4){
      m.hp--;
      if(m.hp<=0){
        addParticles(m.x,m.y,'#3a8030',4);
        mushrooms.splice(mi,1);
      }else{m.w*=0.8;m.h*=0.8;}
    }
  }

  // Keep in bounds
  if(s.x<5){s.x=5;s.dirX=1;}
  if(s.x>FIELD_W-5){s.x=FIELD_W-5;s.dirX=-1;}

  // Game over if spider reaches bottom
  const fieldBottom=FIELD_H-20;
  if(s.y>fieldBottom){gameOver=true;crtPowerOffProgress=0;}
}

function drawSpider(s){
  const sx=s.x, sy=s.y;

  if(s.state==='falling'){
    // Falling: spinning spider (authentic tumbling effect)
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(s.animPhase||0); // spin animation
    ctx.shadowColor='#ff00aa';ctx.shadowBlur=12;
    ctx.strokeStyle='#ff00aa';ctx.lineWidth=2;
    // Spinning body
    ctx.beginPath();ctx.ellipse(0,0,6,4,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,0,170,0.35)';ctx.fill();
    // Spinning legs (all visible during tumble)
    ctx.lineWidth=1.5;ctx.shadowBlur=6;
    for(let i=0;i<4;i++){
      ctx.beginPath();ctx.moveTo(-5,-i*2);ctx.lineTo(-10,-i*2-2);ctx.lineTo(-13,-i*2+2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(5,-i*2);ctx.lineTo(10,-i*2-2);ctx.lineTo(13,-i*2+2);ctx.stroke();
    }
    ctx.shadowBlur=0;
    ctx.restore();
    return;
  }

  // Full spider - detailed vector style with 8 jointed legs

  // Body glow
  ctx.shadowColor='#ff00aa';ctx.shadowBlur=12;
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=2.5;

  // Abdomen (rear) - larger oval with gradient
  ctx.beginPath();ctx.ellipse(sx,sy+3,7,6,0,0,Math.PI*2);ctx.stroke();
  const abdGrad=ctx.createRadialGradient(sx,sy+2,1,sx,sy+3,7);
  abdGrad.addColorStop(0,'rgba(255,0,170,0.4)');
  abdGrad.addColorStop(1,'rgba(255,0,170,0.1)');
  ctx.fillStyle=abdGrad;ctx.fill();

  // Abdomen marking (hourglass pattern)
  ctx.strokeStyle='rgba(255,100,200,0.6)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(sx-2,sy);ctx.lineTo(sx,sy+3);ctx.lineTo(sx+2,sy);ctx.stroke();

  // Cephalothorax (front) - smaller circle
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(sx,sy-5,5,0,Math.PI*2);ctx.stroke();

  // Eyes (multiple red dots - spiders have many eyes)
  ctx.fillStyle='#ff4444';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(sx-2.5,sy-6,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+2.5,sy-6,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx-1.5,sy-3.5,1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+1.5,sy-3.5,1,0,Math.PI*2);ctx.fill();

  // 4 pairs of jointed legs with jumpy animation
  const legFrame=Math.floor(performance.now()/80)%4;
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=1.5;ctx.shadowBlur=6;
  for(let i=0;i<4;i++){
    const lPos = [0, -3, 0, 3][(legFrame+i)%4];
    // Left legs (2-segment joints)
    ctx.beginPath();
    ctx.moveTo(sx-5,sy-i*2);
    ctx.lineTo(sx-10-lPos,sy-i*2-1); // first joint
    ctx.lineTo(sx-13-lPos*1.5,sy-i*2+3); // second joint (foot)
    ctx.stroke();
    // Right legs (2-segment joints)
    ctx.beginPath();
    ctx.moveTo(sx+5,sy-i*2);
    ctx.lineTo(sx+10+lPos,sy-i*2-1);
    ctx.lineTo(sx+13+lPos*1.5,sy-i*2+3);
    ctx.stroke();
  }

  // Pedipalps (front feelers)
  const palpOpen=[1,3,1,3][legFrame];
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=1.5;ctx.shadowBlur=4;
  ctx.beginPath();ctx.moveTo(sx-3,sy-8);ctx.lineTo(sx-6-palpOpen,sy-12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+3,sy-8);ctx.lineTo(sx+6+palpOpen,sy-12);ctx.stroke();

  ctx.shadowBlur=0;
}

// === Flea mechanics ===
// Fleas are dropped by saucers. They fall diagonally, planting mushrooms
// as they descend. In the original, they're worth 50 points and are harder
// to hit than spiders due to their diagonal movement pattern.

let fleaTimer=0;
const FLEA_INTERVAL=360; // spawn flea every 6 seconds (wave 4+)
let fleas=[];

function spawnFlea(){

  if(f.y>fieldBottom){gameOver=true;crtPowerOffProgress=0;}

function drawFlea(f){
  const sx=f.x,sy=f.y;
  ctx.shadowColor='#aaff00';ctx.shadowBlur=10;
  ctx.strokeStyle='#aaff00';ctx.lineWidth=2;

  const lPos=[0,-3,0,3][legFrame];
  ctx.strokeStyle='#aaff00';ctx.lineWidth=1.5;ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(sx-4,sy+2);ctx.lineTo(sx-8-lPos,sy+6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+4,sy+2);ctx.lineTo(sx+8+lPos,sy+6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx-3,sy-2);ctx.lineTo(sx-6+lPos,sy-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+3,sy-2);ctx.lineTo(sx+6-lPos,sy-5);ctx.stroke();

  ctx.shadowBlur=0;

// === Color cycling per stage (arcade authentic) ===
// Original Atari cycled through color palettes every stage.
const STAGE_COLORS = [
  {centiHead:'#ff3333', centiTail:'#44ff22', mush:'#00dd55', border:'#00dd55'},
  {centiHead:'#ff8833', centiTail:'#22ffbb', mush:'#44dd88', border:'#44dd88'},
  {centiHead:'#ff33aa', centiTail:'#88dd44', mush:'#88dd44', border:'#88dd44'},
  {centiHead:'#22ddaa', centiTail:'#44aadd', mush:'#44ddbb', border:'#44ddbb'},
  {centiHead:'#44aadd', centiTail:'#ff33bb', mush:'#aadd44', border:'#aadd44'},
  {centiHead:'#ddaa33', centiTail:'#44dd88', mush:'#dda644', border:'#dda644'},
];
function getSC(){return STAGE_COLORS[(wave-1)%STAGE_COLORS.length];}

// Authentic Atari color gradient: head color -> tail color, interpolated per segment
function getSegmentColor(i,total){
  const sc=getSC();
  const headRgba=sc.centiHead.replace('#','');
  const tailRgba=sc.centiTail.replace('#','');
  const hr=parseInt(headRgba.slice(0,2),16), hg=parseInt(headRgba.slice(2,4),16), hb=parseInt(headRgba.slice(4,6),16);
  const tr=parseInt(tailRgba.slice(0,2),16), tg=parseInt(tailRgba.slice(2,4),16), tb=parseInt(tailRgba.slice(4,6),16);
  const p=total>1?i/(total-1):0; // 0=head, 1=tail
  const r=Math.round(hr+(tr-hr)*p), g=Math.round(hg+(tg-hg)*p), b=Math.round(hb+(tb-hb)*p);
  return `rgba(${r},${g},${b},0.5)`;
}

function drawCenti(c){
  const t=performance.now()/200;

  for(let i=0;i<c.segs.length;i++){
    const seg=c.segs[i];
    // Convert field-relative to screen coords
    const sx=seg.x, sy=seg.y;

    if(i===0){
      // === HEAD: Rectangular with antennae (authentic Atari bitmap style) ===
      const dir=c.dirX;
      const sc=getSC();
      const antWave1=Math.sin(t*6+0.5)*3; // left antenna (phase offset)
      const antWave2=Math.sin(t*6-0.5)*3; // right antenna (independent)

      // Head glow with breathing pulse
      const headPulse=Math.sin(performance.now()/250)*3+10;
      ctx.shadowColor=sc.centiHead;ctx.shadowBlur=headPulse;
      ctx.strokeStyle=sc.centiHead;ctx.lineWidth=2.5;

      // Head body - rectangular, wider than body segments with breathing pulse
      const breathe=Math.sin(performance.now()/300)*1.5;
      ctx.beginPath();
      ctx.rect(sx-seg.w/2-4-breathe*0.3, sy-seg.h/2-2-breathe*0.3, seg.w+8+breathe*0.6, seg.h+4+breathe*0.6);
      ctx.stroke();

      // Inner fill (opaque to distinguish head) with authentic color gradient
      ctx.shadowBlur=4;
      const segColor=getSegmentColor(i,c.segs.length);
      ctx.fillStyle=segColor;
      ctx.fillRect(sx-seg.w/3, sy-seg.h/4, seg.w*0.66, seg.h*0.5);

      // Antennae (2 thin lines waving from front of head)
      ctx.strokeStyle=sc.centiHead;ctx.lineWidth=1.5;ctx.shadowBlur=6;
      const frontX=sx+dir*6; // front edge of head
      ctx.beginPath();ctx.moveTo(frontX,sy-seg.h/2);
      ctx.lineTo(frontX+dir*5, sy-seg.h/2-6+antWave1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(frontX,sy-seg.h/2+2);
      ctx.lineTo(frontX+dir*4, sy-seg.h/2-4-antWave1);ctx.stroke();

      // Antenna tips (bright dots)
      ctx.fillStyle=sc.centiHead;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(frontX+dir*5, sy-seg.h/2-6+antWave1,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(frontX+dir*4, sy-seg.h/2-4-antWave2,1.5,0,Math.PI*2);ctx.fill();

      // Eyes (white dots on front of head, with periodic blink)
      const eyeBlink=Math.sin(performance.now()/2000)>-0.95; // blink every ~3.5s
      if(eyeBlink){
        ctx.fillStyle='#fff';ctx.shadowBlur=4;
        ctx.beginPath();ctx.arc(frontX-1, sy-seg.h/2+1, 1.8,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(frontX+1, sy-seg.h/2+3, 1.8,0,Math.PI*2);ctx.fill();
      }else{
        // Blink: eyes become thin lines
        ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.shadowBlur=2;
        ctx.beginPath();ctx.moveTo(frontX-2.5,sy-seg.h/2+1);ctx.lineTo(frontX+0.5,sy-seg.h/2+1);ctx.stroke();
        ctx.beginPath();ctx.moveTo(frontX-0.5,sy-seg.h/2+3);ctx.lineTo(frontX+2.5,sy-seg.h/2+3);ctx.stroke();
      }

      // Mandibles (small jaw lines below eyes, with occasional twitch)
      const mandTwitch=Math.sin(performance.now()/500)*0.5+0.5; // slow twitch cycle
      const twitchOffset=mandTwitch*1.5;
      ctx.strokeStyle=sc.centiHead;ctx.lineWidth=1.5;ctx.shadowBlur=3;
      ctx.beginPath();ctx.moveTo(frontX-2, sy+seg.h/2);
      ctx.lineTo(frontX-dir*(4+twitchOffset), sy+seg.h/2+3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(frontX+2, sy+seg.h/2);
      ctx.lineTo(frontX-dir*(3+twitchOffset), sy+seg.h/2+4);ctx.stroke();

      ctx.shadowBlur=0;
        }else if(i===c.segs.length-1){
      // === TAIL: Tapered segment with pronounced wag (authentic Atari look) ===
      const tailWag=Math.sin(t*5)*4; // more pronounced wag
      const sc=getSC();
      const segColor=getSegmentColor(i,c.segs.length);

      ctx.shadowColor=segColor;ctx.shadowBlur=8;
      ctx.strokeStyle=segColor;ctx.lineWidth=2;

      // Tapered tail: triangle pointing down, offset by wag
      const tx=sx+tailWag;
      ctx.beginPath();
      ctx.moveTo(tx-3, sy-seg.h/2);
      ctx.lineTo(tx+3, sy-seg.h/2);
      ctx.lineTo(tx+tailWag*0.5, sy+seg.h/2+4); // tapered point
      ctx.closePath();
      ctx.stroke();

      // Inner fill with gradient color for depth
      const tailGrad=ctx.createLinearGradient(tx,sy-seg.h/2,tx,sy+seg.h/2+4);
      tailGrad.addColorStop(0,segColor);
      tailGrad.addColorStop(1,'rgba(0,0,0,0.15)');
      ctx.fillStyle=tailGrad;
      ctx.fill();

      // Small tail tip dot
      ctx.fillStyle=segColor;ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(tx+tailWag*0.5, sy+seg.h/2+4, 1.5,0,Math.PI*2);ctx.fill();

      // Tiny trail particles behind tail tip (authentic: dust trail)
      if(Math.random()>0.7){
        particles.push({x:tx+tailWag*0.5,y:sy+seg.h/2+4,vx:(Math.random()-0.5)*1,vy:Math.random()*1+0.5,
          life:10+Math.random()*8,color:segColor,size:1+Math.random()});
      }

      ctx.shadowBlur=0;
    }else{
      // === BODY SEGMENTS: Rectangular shape with jumpy leg animation + color gradient ===
      const sc=getSC();
      const segColor=getSegmentColor(i,c.segs.length);

      // Original: rapid, jumpy leg animation (16fps, not smooth)
      const legPhase=Math.floor(t*8+i*2)%4; // 4 discrete frames
      const legPos = [0, -2, 0, 2][legPhase]; // jumpy positions

      // Small shadow beneath segment (authentic Atari depth effect)
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(sx+1,sy+seg.h/2+1,seg.w*0.35,0,Math.PI*2);ctx.fill();

      // Pulsing body glow (authentic: segments glow brighter as centipede moves)
      const bodyGlowPulse=Math.sin(performance.now()/200+i*0.5)*0.3+0.7;
      ctx.shadowColor=segColor;ctx.shadowBlur=6*bodyGlowPulse;

      // Segment body - rectangular shape (original was bitmap, wider than tall)
      ctx.strokeStyle=segColor;ctx.lineWidth=2;
      ctx.beginPath();
      ctx.rect(sx-seg.w/2-1, sy-seg.h/2, seg.w+2, seg.h);
      ctx.stroke();

      // Inner fill with gradient color
      ctx.fillStyle=segColor;
      ctx.fillRect(sx-seg.w/3, sy-seg.h/4, seg.w*0.66, seg.h*0.5);

      // Animated legs (jumpy, 4-frame animation)
      const legLen=3;
      // Tiny leg shadow beneath each foot
      ctx.fillStyle='rgba(0,0,0,0.15)';ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(sx-seg.w/3+legPos,sy+seg.h/2+legLen+1,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+seg.w/3-legPos,sy+seg.h/2+legLen+1,1.5,0,Math.PI*2);ctx.fill();

      ctx.strokeStyle=segColor;ctx.lineWidth=1;ctx.shadowBlur=4;
      // Left leg
      ctx.beginPath();
      ctx.moveTo(sx-seg.w/4,sy+seg.h/2);
      ctx.lineTo(sx-seg.w/3+legPos,sy+seg.h/2+legLen);
      ctx.stroke();
      // Right leg
      ctx.beginPath();
      ctx.moveTo(sx+seg.w/4,sy+seg.h/2);
      ctx.lineTo(sx+seg.w/3-legPos,sy+seg.h/2+legLen);
      ctx.stroke();

      ctx.shadowBlur=0;
    }
  }
}

function drawMush(m){
  const sx=m.x, sy=m.y;
  const sc=getSC();

  // Growth animation: mushrooms grow from small to full size
  let growScale=1;
  if(m.growProgress!==undefined&&m.growProgress<1){
    m.growProgress+=0.05;
    // Spores while growing
    if(Math.random()>0.7){
      particles.push({x:m.x+(Math.random()-0.5)*m.w,y:m.y-m.h*0.3,
        vx:(Math.random()-0.5)*0.5,vy:-Math.random()*0.8,
        life:15+Math.random()*10,color:'#4a9040',size:1+Math.random()*0.5});
    }
    if(m.growProgress>=1){m.growProgress=1;}
    else{growScale=0.3+m.growProgress*0.7;}
  }

  const mw=m.w*growScale;
  const mh=m.h*growScale;

  // Authentic Atari mushroom: bitmap-style cap + stem + spots
  const mushRgba=sc.mush.replace('#','');
  const mr=parseInt(mushRgba.slice(0,2),16);
  const mg=parseInt(mushRgba.slice(2,4),16);
  const mb=parseInt(mushRgba.slice(4,6),16);

  ctx.shadowColor=sc.mush;ctx.shadowBlur=6;

  // Stem (thick, slightly tapered)
  ctx.strokeStyle=sc.mush;ctx.lineWidth=2.5*growScale;
  ctx.beginPath();ctx.moveTo(sx,sy+3*growScale);ctx.lineTo(sx,sy+mh/2);ctx.stroke();

  // Cap - half-ellipse with thicker stroke (authentic bitmap look)
  ctx.lineWidth=2.5*growScale;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(sx,sy,mw/2,Math.PI,0);ctx.stroke();

  // Specular highlight on cap (tiny white reflection)
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(sx-mw*0.15,sy-mw*0.2,mw*0.12,0,Math.PI*2);ctx.fill();

  // Cap fill with gradient for depth
  const capGrad=ctx.createRadialGradient(sx,sy-mw*0.2,1,sx,sy,mw/2);
  capGrad.addColorStop(0,`rgba(${mr},${mg},${mb},0.45)`);
  capGrad.addColorStop(1,`rgba(${mr},${mg},${mb},0.15)`);
  ctx.fillStyle=capGrad;
  ctx.beginPath();ctx.arc(sx,sy,mw/2,Math.PI,0);ctx.fill();

  // Spots (white dots on cap) - original had 1-3 spots
  ctx.shadowBlur=3;ctx.fillStyle=`rgba(${Math.min(255,mr+80)},${Math.min(255,mg+80)},${Math.min(255,mb+80)},0.9)`;
  if(m.spots){
    for(let i=0;i<m.spots.length;i++){
      const sp=m.spots[i];
      ctx.beginPath();
      ctx.arc(sx+Math.cos(sp.angle)*sp.dist*growScale,sy+Math.sin(sp.angle)*sp.dist*0.5*growScale-3*growScale,2.2*growScale,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Damage indicator: red tint when damaged (hp < 4) - shrinking cap
  if(m.hp<4){
    const dmgLevel=(4-m.hp)/4; // 0.25 per hit
    ctx.fillStyle=`rgba(255,80,0,${dmgLevel*0.35})`;
    ctx.beginPath();ctx.arc(sx,sy,mw/2,Math.PI,0);ctx.fill();
    // Crack lines on damaged mushrooms
    if(m.hp<=2){
      ctx.strokeStyle=`rgba(255,200,0,${dmgLevel*0.4})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx-mw*0.2,sy-mw*0.15);ctx.lineTo(sx+mw*0.1,sy+mw*0.05);ctx.stroke();
    }
  }

  ctx.shadowBlur=0;
}

function drawShip(s){
  const sx=s.x, sy=s.y;

  // Blink when invincible
  if(invincibleTimer>0&&Math.floor(invincibleTimer/4)%2===0)return;

  // Authentic Atari Centipede player: humanoid gunner with gun barrel
  // Body: small rectangle (torso)
  ctx.shadowColor='#2288ff';ctx.shadowBlur=10;
  ctx.strokeStyle='#2288ff';ctx.lineWidth=2.5;

  // Torso (rectangle)
  ctx.beginPath();ctx.rect(sx-4,sy-2,8,10);ctx.stroke();
  ctx.fillStyle='rgba(34,136,255,0.3)';
  ctx.fillRect(sx-4,sy-2,8,10);

  // Ground shadow beneath player
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.shadowBlur=0;
  ctx.beginPath();ctx.ellipse(sx,sy+14,8,2,0,0,Math.PI*2);ctx.fill();

  // Legs/feet (small lines at bottom)
  ctx.strokeStyle='#2288ff';ctx.lineWidth=1.5;ctx.shadowBlur=3;
  ctx.beginPath();ctx.moveTo(sx-3,sy+8);ctx.lineTo(sx-4,sy+12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+3,sy+8);ctx.lineTo(sx+4,sy+12);ctx.stroke();
  // Feet (small horizontal lines)
  ctx.beginPath();ctx.moveTo(sx-5,sy+12);ctx.lineTo(sx-3,sy+12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+3,sy+12);ctx.lineTo(sx+5,sy+12);ctx.stroke();

  // Head (circle on top) with idle breathing
  const breathe=Math.sin(performance.now()/400)*0.5; // subtle breathing
  ctx.beginPath();ctx.arc(sx,sy-5+breathe,4+breathe*0.3,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(34,136,255,0.4)';ctx.fill();

  // Eyes
  ctx.fillStyle='#fff';ctx.shadowBlur=4;
  ctx.beginPath();ctx.arc(sx-1.5,sy-5.5+breathe,1.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+1.5,sy-5.5+breathe,1.2,0,Math.PI*2);ctx.fill();

  // Gun barrel (pointing up from center)
  ctx.shadowColor='#44aaff';ctx.shadowBlur=8;
  ctx.strokeStyle='#44aaff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(sx,sy-9);ctx.lineTo(sx,sy-18);ctx.stroke();

  // Gun tip (bright glow)
  ctx.fillStyle='#88ccff';ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(sx,sy-18,2.5,0,Math.PI*2);ctx.fill();

  // Gun tip inner (white hot)
  ctx.fillStyle='#fff';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(sx,sy-18,1.2,0,Math.PI*2);ctx.fill();

  // Subtle aim line (faint guide from gun tip upward)
  ctx.strokeStyle='rgba(136,204,255,0.1)';ctx.lineWidth=1;ctx.shadowBlur=0;
  ctx.setLineDash([2,4]);
  ctx.beginPath();ctx.moveTo(sx,sy-18);ctx.lineTo(sx,sy-35);ctx.stroke();
  ctx.setLineDash([]);

  // Muzzle flash when firing
  if(muzzleFlash>0){
    ctx.fillStyle=`rgba(255,255,200,${muzzleFlash/8})`;ctx.shadowColor='#fff';ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(sx,sy-18,5+muzzleFlash*0.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${muzzleFlash/10})`;
    ctx.beginPath();ctx.arc(sx,sy-18,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=6;
  }

  ctx.shadowBlur=0;
}

function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];ctx.globalAlpha=Math.min(1,p.life/20);
    // Multi-layer particle: outer glow + inner bright core
    ctx.shadowColor=p.color;ctx.shadowBlur=10;
    ctx.fillStyle=p.color;
    // Main particle body
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    // Bright core (white-hot center)
    ctx.fillStyle='rgba(255,255,255,'+ctx.globalAlpha*0.7+')';
    ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.4,0,Math.PI*2);ctx.fill();
    // Spark trail (small line behind particle)
    ctx.strokeStyle=p.color;ctx.lineWidth=1.5;ctx.shadowBlur=3;
    ctx.globalAlpha*=0.5;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function drawFloatText(){
  for(let i=0;i<floatText.length;i++){
    const ft=floatText[i];ctx.globalAlpha=Math.min(1,ft.life/20);
    // Multi-layer glow for CRT phosphor effect
    ctx.shadowColor=ft.color;ctx.shadowBlur=20;
    ctx.strokeStyle=ft.color;ctx.lineWidth=3;ctx.font='bold 16px monospace';
    for(let j=0;j<ft.text.length;j++){ctx.strokeText(ft.text[j],ft.x,ft.y-j*18);}
    ctx.shadowBlur=8;ctx.lineWidth=1.5;
    for(let j=0;j<ft.text.length;j++){ctx.strokeText(ft.text[j],ft.x,ft.y-j*18);}
    ctx.fillStyle=ft.color;
    for(let j=0;j<ft.text.length;j++){ctx.fillText(ft.text[j],ft.x,ft.y-j*18);}
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

// === Background (subtle grid dots - authentic Atari playfield) ===
function drawBackground(){
  // Pure black background
  ctx.fillStyle='#000';ctx.fillRect(0,0,FIELD_W,FIELD_H);

  // Authentic Atari playfield: subtle cross-hair grid at intersections
  ctx.fillStyle='rgba(15,30,15,0.12)';
  const cellW=FIELD_W/GRID_COLS;
  const cellH=(FIELD_H-60)/GRID_ROWS;
  const startY=35;
  for(let r=0;r<GRID_ROWS;r++){
    for(let c=0;c<GRID_COLS;c++){
      const px=c*cellW+cellW/2;
      const py=startY+r*cellH+cellH/2;
      // Cross pattern instead of single dot (authentic Atari style)
      ctx.fillRect(px-0.5,py-0.5,1,1);
      ctx.fillRect(px-1.5,py,0.5,0.5);
      ctx.fillRect(px+1,py,0.5,0.5);
      ctx.fillRect(px,py-1.5,0.5,0.5);
      ctx.fillRect(px,py+1,0.5,0.5);
    }
  }

  // Subtle horizontal lane lines (every 2 rows) - guides the eye down the field
  ctx.strokeStyle='rgba(15,30,15,0.06)';ctx.lineWidth=0.5;
  for(let r=0;r<GRID_ROWS;r+=2){
    const py=startY+r*cellH;
    ctx.beginPath();ctx.moveTo(4,py);ctx.lineTo(FIELD_W-4,py);ctx.stroke();
  }
}

// === CRT overlay (scanlines + vignette + barrel distortion + chromatic aberration) ===
function drawCRTOverlay(){
  // Screen shake update
  if(screenShakeDecay>0){
    screenShakeX=(Math.random()-0.5)*screenShakeDecay;
    screenShakeY=(Math.random()-0.5)*screenShakeDecay;
    screenShakeDecay*=0.85;
    if(screenShakeDecay<0.3)screenShakeDecay=0;
  }else{screenShakeX=0;screenShakeY=0;}

  // Impact flash (in field coords, before restore)
  if(impactFlash>0){
    ctx.fillStyle=`rgba(255,255,255,${impactFlash/15})`;
    ctx.fillRect(0,0,FIELD_W,FIELD_H);
    impactFlash--;
  }

  // CRT barrel distortion + chromatic aberration (optimized for retina displays)
  // Instead of per-pixel manipulation, use layered canvas draws for the same effect
  crtCtx2d.clearRect(0,0,W,H);

  const cx=W/2, cy=H/2;
  const chromaAmt=2; // chromatic aberration pixel shift
  const rgbEdge=2; // pixel width of edge fringing

  // Draw the main canvas to offscreen with slight barrel distortion via transform
  crtCtx2d.save();
  // Subtle barrel: scale edges slightly differently
  const barrelScale = 1.02; // slight outward curve
  crtCtx2d.translate(cx,cy);
  crtCtx2d.scale(barrelScale, barrelScale);
  crtCtx2d.translate(-cx,-cy);
  crtCtx2d.drawImage(canvas,0,0);
  crtCtx2d.restore();

  // Chromatic aberration via layered draws (much faster than per-pixel)
  crtCtx2d.globalCompositeOperation='screen';
  crtCtx2d.globalAlpha=0.04;
  // Red channel shift (right)
  crtCtx2d.drawImage(canvas, chromaAmt, 0);
  // Blue channel shift (left)
  crtCtx2d.drawImage(canvas, -chromaAmt, 0);
  crtCtx2d.globalAlpha=1;
  crtCtx2d.globalCompositeOperation='source-over';

  // Subtle RGB color separation on screen edges (real CRT fringing quirk)
  crtCtx2d.globalCompositeOperation='lighter';
  crtCtx2d.globalAlpha=0.03; // very subtle
  crtCtx2d.drawImage(canvas,rgbEdge,0);
  crtCtx2d.drawImage(canvas,-rgbEdge,0);
  crtCtx2d.globalAlpha=1;
  crtCtx2d.globalCompositeOperation='source-over';

  // Draw CRT-processed image back to main canvas
  ctx.restore(); // exit game transform
  ctx.drawImage(crtOffscreen,0,0);

  // CRT turn-on animation: horizontal line sweeps across screen
  if(crtTurnOnProgress<1){
    crtTurnOnProgress+=0.04; // ~25 frames to fully turn on
    if(crtTurnOnProgress>1)crtTurnOnProgress=1;
    // Draw horizontal wipe effect
    const wipeY=crtTurnOnProgress*H;
    const wipeH=Math.max(20,H*0.1); // band height
    ctx.save();
    ctx.beginPath();ctx.rect(0,wipeY-wipeH/2,W,wipeH);ctx.clip();
    // Bright horizontal line at the wipe edge
    ctx.fillStyle=`rgba(255,255,255,${0.3*(1-crtTurnOnProgress)})`;
    ctx.fillRect(0,wipeY-wipeH/2,W,wipeH);
    ctx.restore();
    // Fade in the rest of the screen
    ctx.fillStyle=`rgba(0,0,0,${Math.max(0,1-crtTurnOnProgress)})`;
    ctx.fillRect(0,0,W,H);
  }

  // Phosphor afterglow: semi-transparent overlay of previous frame (CRT persistence)
  ctx.globalAlpha=0.12; // phosphor persistence amount
  ctx.drawImage(crtOffscreen,0,0);
  ctx.globalAlpha=1;

  // CRT flicker (subtle power hum effect - random brightness variation)
  const flickerAlpha=0.01+Math.random()*0.015;
  ctx.fillStyle=`rgba(0,0,0,${flickerAlpha})`;
  ctx.fillRect(0,0,W,H);

  // Dot crawl (subtle horizontal banding - real CRT artifact)
  const crawlPhase=performance.now()/200;
  ctx.fillStyle=`rgba(0,0,0,${0.008+Math.sin(crawlPhase)*0.004})`;
  for(let cy=0;cy<H;cy+=8){
    ctx.fillRect(0,cy,W,1);
  }

  // Subtle phosphor glow around bright elements (CRT persistence bloom)
  ctx.globalCompositeOperation='screen';
  ctx.fillStyle='rgba(0,255,68,0.012)'; // green phosphor bleed
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,100,0,0.008)'; // warm phosphor bleed
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  // Scanlines over barrel-distorted image
  if(scanlinePattern){
    ctx.fillStyle=scanlinePattern;
    ctx.fillRect(0,0,W,H);
  }

  // Vignette (darker corners)
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);

  // CRT power-off effect (screen collapses to horizontal line with static)
  if(crtPowerOffProgress>0&&crtPowerOffProgress<1){
    // Static noise during power-off (random white dots)
    const staticAlpha=crtPowerOffProgress*0.15;
    for(let n=0;n<200;n++){
      const nx=Math.random()*W, ny=Math.random()*H;
      ctx.fillStyle=`rgba(255,255,255,${staticAlpha*Math.random()})`;
      ctx.fillRect(nx,ny,1,1);
    }
    const squeeze=1-crtPowerOffProgress*0.95; // vertical squeeze 1->0.05
    const brightness=1-crtPowerOffProgress*0.7; // dimming
    ctx.save();
    ctx.translate(0,H/2);ctx.scale(1,squeeze);ctx.translate(0,-H/2);
    ctx.drawImage(crtOffscreen,0,0);
    ctx.restore();
    // Bright white horizontal line at center
    const lineAlpha=crtPowerOffProgress*0.8;
    ctx.fillStyle=`rgba(255,255,255,${lineAlpha})`;
    ctx.fillRect(0,H/2-2,W,4);
    // Overall dimming
    ctx.fillStyle=`rgba(0,0,0,${1-brightness})`;
    ctx.fillRect(0,0,W,H);
  }

  // CRT monitor bezel mask (rounded corners like real CRT display)
  ctx.globalCompositeOperation='destination-out';
  const cornerR=Math.min(W,H)*0.04; // corner radius as % of screen
  ctx.beginPath();
  ctx.moveTo(cornerR,0);
  ctx.lineTo(W-cornerR,0);
  ctx.quadraticCurveTo(W,0,W,cornerR);
  ctx.lineTo(W,H-cornerR);
  ctx.quadraticCurveTo(W,H,W-cornerR,H);
  ctx.lineTo(cornerR,H);
  ctx.quadraticCurveTo(0,H,0,H-cornerR);
  ctx.lineTo(0,cornerR);
  ctx.quadraticCurveTo(0,0,cornerR,0);
  ctx.closePath();
  ctx.clip();
  // Fill entire screen white (keeps visible area)
  ctx.fillStyle='rgba(255,255,255,1)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  // Phosphor bloom: subtle colored glow
  ctx.globalCompositeOperation='screen';
  ctx.fillStyle='rgba(0,255,68,0.015)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  return true; // signals that we already restored
}

// === Bullet drawing (field-relative) - enhanced with trail + glow ===
function drawBullet(b){
  const sx=b.x, sy=b.y;
  // Slight wobble for organic dart feel
  const wobble=Math.sin(performance.now()/60+b.y*0.3)*0.5;

  // Main dart: bright white with intense glow
  ctx.shadowColor='#ffffff';ctx.shadowBlur=15;
  ctx.strokeStyle='#ffffff';ctx.lineWidth=3.5;

  // Ionization glow (blue-white aura around dart)
  ctx.shadowColor='#88ccff';ctx.shadowBlur=10;
  ctx.strokeStyle='rgba(136,204,255,0.3)';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(sx+wobble*0.5,sy-12);ctx.lineTo(sx,sy+4);ctx.stroke();

  // Bullet body (bright line) with wobble
  ctx.shadowColor='#fff';ctx.shadowBlur=14;
  ctx.beginPath();ctx.moveTo(sx+wobble,sy-14);ctx.lineTo(sx,sy+6);ctx.stroke();

  // Orange trail (fading behind bullet)
  ctx.shadowBlur=10;
  ctx.strokeStyle='rgba(255,200,50,0.7)';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(sx+wobble*0.5,sy-8);ctx.lineTo(sx,sy+6);ctx.stroke();

  // Faint outer trail
  ctx.shadowBlur=6;
  ctx.strokeStyle='rgba(255,150,20,0.3)';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(sx,sy-4);ctx.lineTo(sx,sy+4);ctx.stroke();

  // Bright tip (white-hot point)
  ctx.fillStyle='#ffffff';ctx.shadowColor='#fff';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(sx+wobble,sy-14,3,0,Math.PI*2);ctx.fill();

  // Inner core (even brighter)
  ctx.fillStyle='#fff';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(sx+wobble,sy-14,1.5,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
}

// === Field border with glow effect (authentic Atari cabinet framing) ===
function drawFieldBorder(){
  // Animated pulse on border (subtle CRT phosphor effect)
  const t=performance.now()/400;
  const borderPulse=Math.sin(t)*2+8; // blur oscillates between 6-10
  const borderAlpha=0.7+Math.sin(t*0.5)*0.3; // brightness oscillation

  // Outer border: bright green with strong glow
  ctx.strokeStyle=`rgba(0,255,68,${borderAlpha})`;ctx.lineWidth=3;
  ctx.shadowColor='#00ff44';ctx.shadowBlur=borderPulse;
  ctx.strokeRect(0,0,FIELD_W,FIELD_H);

  // Inner border line (authentic double-line effect)
  ctx.strokeStyle='#00ff44';ctx.lineWidth=1.5;ctx.shadowBlur=6;
  ctx.strokeRect(3,3,FIELD_W-6,FIELD_H-6);

  // Corner brackets (L-shaped, authentic Atari style)
  ctx.strokeStyle='#00ff44';ctx.lineWidth=3;ctx.shadowBlur=10;
  const cs=16; // corner size

  // Top-left bracket
  ctx.beginPath();ctx.moveTo(0,cs);ctx.lineTo(0,0);ctx.lineTo(cs,0);ctx.stroke();
  // Top-right bracket
  ctx.beginPath();ctx.moveTo(FIELD_W-cs,0);ctx.lineTo(FIELD_W,0);ctx.lineTo(FIELD_W,cs);ctx.stroke();
  // Bottom-left bracket
  ctx.beginPath();ctx.moveTo(0,FIELD_H-cs);ctx.lineTo(0,FIELD_H);ctx.lineTo(cs,FIELD_H);ctx.stroke();
  // Bottom-right bracket
  ctx.beginPath();ctx.moveTo(FIELD_W,FIELD_H-cs);ctx.lineTo(FIELD_W,FIELD_H);ctx.lineTo(FIELD_W-cs,FIELD_H);ctx.stroke();

  // Corner dots (bright)
  ctx.fillStyle='#00ff44';ctx.shadowBlur=8;
  const dotR=2.5;
  ctx.beginPath();ctx.arc(0,0,dotR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(FIELD_W,0,dotR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,FIELD_H,dotR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(FIELD_W,FIELD_H,dotR,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
}

// === HUD with arcade styling (authentic Atari cabinet layout) ===
function drawHUD(){
  // Score (top left, bright white with glow)
  ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.shadowColor='#fff';ctx.shadowBlur=6;
  ctx.fillText('SCORE '+score,10,OY-6);ctx.shadowBlur=0;

  // Lives as small player icons (matching in-game sprite)
  for(let i=0;i<lives;i++){
    const lx=18+i*24, ly=OY+6;
    ctx.shadowColor='#2288ff';ctx.shadowBlur=4;
    ctx.strokeStyle='#2288ff';ctx.lineWidth=1.5;
    // Torso
    ctx.beginPath();ctx.rect(lx-3,ly-2,6,7);ctx.stroke();
    ctx.fillStyle='rgba(34,136,255,0.3)';ctx.fill();
    // Head
    ctx.beginPath();ctx.arc(lx,ly-4,3,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
  }

  // Wave (top right)
  ctx.fillStyle='#4f4';ctx.font='bold 16px monospace';ctx.shadowColor='#4f4';ctx.shadowBlur=6;
  ctx.fillText('WAVE '+wave,W-90,OY-6);ctx.shadowBlur=0;

  // High score (below wave)
  // HI score with pulsing glow
  const hiPulse=Math.sin(performance.now()/500)*2+4;
  ctx.fillStyle='#ff0';ctx.font='bold 12px monospace';ctx.shadowColor='#ff0';ctx.shadowBlur=hiPulse;
  ctx.fillText('HI '+highScore,W-95,OY+10);ctx.shadowBlur=0;
}

// === Attract/start screen (authentic Atari cabinet style) ===
function drawAttract(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  const t=performance.now()/300;
  const pulse=Math.sin(t)*0.3+0.7;

  // Layout: compact to ensure everything fits on one screen
  const titleH=62;       // space for title at top (no subtitle)
  const scoreH=75;       // space for score table below field
  const promptH=35;      // space for start prompt at bottom
  const availH=H-titleH-scoreH-promptH;  // remaining for field
  const availW=W-40;

  // Scale field to fit the available space
  const attractScale=Math.min(availW/FIELD_W, availH/FIELD_H, 3);
  const attractOX=(W-FIELD_W*attractScale)/2;
  const fieldTop=titleH;

  // === TITLE: Iconic Atari CENTIPEDE logo style ===
  // Large, stylized title with multi-layer glow
  ctx.textAlign='center';

  // Outer glow layer (red, wide)
  ctx.shadowColor='#ff2200';ctx.shadowBlur=40*pulse;
  ctx.strokeStyle='#ff2200';ctx.lineWidth=4;
  ctx.font='bold 52px monospace';
  const title='CENTIPEDE',tw=ctx.measureText(title).width;
  ctx.strokeText(title,W/2,titleH-16);

  // Inner glow layer (bright red, tighter)
  ctx.shadowBlur=15*pulse;ctx.lineWidth=2.5;
  ctx.strokeText(title,W/2,titleH-16);

  // Fill with gradient
  const titleGrad=ctx.createLinearGradient(W/2-tw/2,titleH-30,W/2+tw/2,titleH-6);
  titleGrad.addColorStop(0,'rgba(255,80,40,0.6)');
  titleGrad.addColorStop(0.5,'rgba(255,34,0,0.8)');
  titleGrad.addColorStop(1,'rgba(255,80,40,0.6)');
  ctx.fillStyle=titleGrad;
  ctx.fillText(title,W/2,titleH-16);

  // White-hot center line
  ctx.shadowColor='#fff';ctx.shadowBlur=8*pulse;
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
  ctx.strokeText(title,W/2,titleH-7);

  // CRT burn-in ghosting: faint afterimage slightly offset
  ctx.fillStyle='rgba(255,34,0,0.08)';ctx.shadowBlur=0;
  ctx.fillText(title,W/2+1,titleH-15); // slight offset ghost
  ctx.fillStyle='rgba(255,34,0,0.05)';
  ctx.fillText(title,W/2-1,titleH-17); // double ghost

  ctx.shadowBlur=0;ctx.textAlign='start';

  // Subtle "DEMO" label (authentic: original had this during attract mode)
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='8px monospace';
  ctx.fillText('DEMO',W/2-10,titleH+15);

  // Coin counter display (authentic: shows coin slots)
  const coinBlink=Math.sin(performance.now()/400)>0;
  if(coinBlink){
    ctx.fillStyle='rgba(255,200,0,0.4)';ctx.font='8px monospace';
    ctx.fillText('1P 2P',W/2+30,titleH+15);
  }

  // Apply CRT overlay to attract screen too
  if(scanlinePattern){
    ctx.fillStyle=scanlinePattern;ctx.fillRect(0,0,W,H);
  }
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  // Field with crawling demo centipede
  ctx.save();ctx.translate(attractOX,fieldTop);ctx.scale(attractScale,attractScale);
  drawBackground();

  // Demo mushrooms (scattered)
  const demoMushrooms=[];
  for(let r=0;r<GRID_ROWS-3;r++){
    for(let c=0;c<GRID_COLS;c++){
      let seed=r*GRID_COLS+c+42;
      seed=(seed*1103515245+12345)&0x7fffffff;
      if((seed%100)<60){
        const cellW=FIELD_W/GRID_COLS;
        const cellH=(FIELD_H-60)/GRID_ROWS;
        demoMushrooms.push({x:c*cellW+cellW/2,y:35+r*cellH,w:cellW*0.8,h:cellH*0.9});
      }
    }
  }
  // Draw demo mushrooms (simplified)
  const mushColor=getSC().mush;
  ctx.shadowColor=mushColor;ctx.shadowBlur=4;
  ctx.strokeStyle=mushColor;ctx.lineWidth=1;
  for(let m of demoMushrooms){
    ctx.beginPath();ctx.arc(m.x,m.y,m.w/2,Math.PI,0);ctx.stroke();
  }
  ctx.shadowBlur=0;

  ctx.shadowBlur=0;
  drawFieldBorder();

  // Crawling demo centipede (field-relative, rectangular segments with antennae)
  const crawlY=FIELD_H*0.3+Math.sin(t*0.5)*FIELD_H*0.1; // vertical wobble
  const crawlX=(t*40)%((FIELD_W+80))-40;
  const crawlDir=1; // crawling right to left
  const sc=getSC();
  for(let i=0;i<12;i++){
    const sx=crawlX-i*12, sy=crawlY+Math.sin(t*4+i*0.5)*3;
    const p=i/12;
    const col = sc.centiHead;
    ctx.shadowColor=col;ctx.shadowBlur=6;
    ctx.strokeStyle=col;ctx.lineWidth=2;
    // Rectangular segment (matching in-game style)
    ctx.beginPath();ctx.rect(sx-4,sy-3,8,6);ctx.stroke();
    // Use stage head color for inner fill (matches in-game centipede)
    const headRgba=sc.centiHead.replace('#','');
    ctx.fillStyle=`rgba(${parseInt(headRgba.slice(0,2),16)},${parseInt(headRgba.slice(2,4),16)},${parseInt(headRgba.slice(4,6),16)},${0.3*(1-p)})`;
    ctx.fillRect(sx-2,sy-1.5,4,3);
  }
  // Antennae on head segment (matching in-game centipede)
  const antWave=Math.sin(t*6)*3;
  const headSx=crawlX, headSy=crawlY;
  const frontX=headSx+crawlDir*6;
  ctx.strokeStyle=sc.centiHead;ctx.lineWidth=1.5;ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(frontX,headSy-3);
  ctx.lineTo(frontX+crawlDir*5, headSy-9+antWave);ctx.stroke();
  ctx.beginPath();ctx.moveTo(frontX,headSy-1);
  ctx.lineTo(frontX+crawlDir*4, headSy-7-antWave);ctx.stroke();
  // Antenna tips
  ctx.fillStyle=sc.centiHead;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(frontX+crawlDir*5, headSy-9+antWave,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(frontX+crawlDir*4, headSy-7+antWave,1.5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Flying saucer demo (sweeping across top of field)
  const saucerX=(t*60)%((FIELD_W+100))-50;
  const saucerY=20;
  ctx.shadowColor='#ffcc00';ctx.shadowBlur=14;
  ctx.strokeStyle='#ffcc00';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.ellipse(saucerX,saucerY-2,18,8,0,Math.PI,0);ctx.stroke();
  ctx.fillStyle='rgba(255,204,0,0.15)';ctx.fill();
  ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(saucerX,saucerY+2,18,4,0,0,Math.PI*2);ctx.stroke();
  const sLightPulse=Math.sin(t*3)*0.5+0.5;
  ctx.fillStyle=`rgba(255,255,255,${0.5+sLightPulse*0.5})`;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(saucerX,saucerY-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;  // Scorpion demo sprite (bottom area of field)
  const scorpX=(t*25)%((FIELD_W+40))-20;
  const scorpY=FIELD_H*0.75+Math.sin(t*2)*15;
  const legFrame=Math.floor(t*5)%4;
  const lPos=[0,-2,0,2][legFrame];
  ctx.shadowColor='#ff6600';ctx.shadowBlur=10;
  ctx.strokeStyle='#ff6600';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(scorpX,scorpY,7,5,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,102,0,0.3)';ctx.fill();
  const tailCurl=Math.sin(t*3)*2;
  ctx.beginPath();ctx.moveTo(scorpX,scorpY+5);
  ctx.quadraticCurveTo(scorpX+tailCurl,scorpY+12,scorpX+tailCurl*1.5,scorpY+6);ctx.stroke();
  ctx.fillStyle='#ffcc00';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(scorpX+tailCurl*1.5,scorpY+6,2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ff6600';ctx.lineWidth=1.5;ctx.shadowBlur=4;
  for(let i=0;i<4;i++){
    const ly=scorpY-3+i*2.5;
    ctx.beginPath();ctx.moveTo(scorpX-6,ly);ctx.lineTo(scorpX-9-lPos,ly+3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(scorpX+6,ly);ctx.lineTo(scorpX+9+lPos,ly+3);ctx.stroke();
  }
  ctx.shadowBlur=0;  // Spider demo sprite (crawling near bottom)
  const spidX=(t*15+50)%((FIELD_W+40))-20;
  const spidY=FIELD_H*0.65+Math.sin(t*1.5+1)*20;
  const spidLP=[0,-3,0,3][Math.floor(t*4)%4];
  ctx.shadowColor='#ff00aa';ctx.shadowBlur=10;
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(spidX,spidY+3,7,6,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,0,170,0.3)';ctx.fill();
  ctx.strokeStyle='rgba(255,100,200,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(spidX-2,spidY);ctx.lineTo(spidX,spidY+3);ctx.lineTo(spidX+2,spidY);ctx.stroke();
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(spidX,spidY-5,5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#ff4444';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(spidX-2.5,spidY-6,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(spidX+2.5,spidY-6,1.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=1.5;ctx.shadowBlur=4;
  for(let i=0;i<4;i++){
    const ly=spidY-i*2;
    ctx.beginPath();ctx.moveTo(spidX-5,ly);ctx.lineTo(spidX-10-spidLP,ly-1);ctx.lineTo(spidX-13-spidLP*1.5,ly+3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(spidX+5,ly);ctx.lineTo(spidX+10+spidLP,ly-1);ctx.lineTo(spidX+13+spidLP*1.5,ly+3);ctx.stroke();
  }
  ctx.shadowBlur=0;

  // Flea demo sprite (falling diagonally)
  const fleaX=(t*20+80)%((FIELD_W+40))-20;
  const fleaY=FIELD_H*0.45+Math.sin(t*3)*25;
  const fleaLP=[0,-3,0,3][Math.floor(t*6)%4];
  ctx.shadowColor='#aaff00';ctx.shadowBlur=10;
  ctx.strokeStyle='#aaff00';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(fleaX,fleaY,5,4,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(170,255,0,0.35)';ctx.fill();
  ctx.lineWidth=1.5;ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(fleaX-4,fleaY+2);ctx.lineTo(fleaX-8-fleaLP,fleaY+6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(fleaX+4,fleaY+2);ctx.lineTo(fleaX+8+fleaLP,fleaY+6);ctx.stroke();
  ctx.shadowBlur=0;  // Demo explosion (flashing near centipede head when bullet "hits")
  const explFlash=Math.sin(t*10); // rapid flash
  if(explFlash>0.5){
    const explX=crawlX, explY=crawlY;
    for(let e=0;e<8;e++){
      const angle=e*Math.PI/4+t*2;
      const dist=(explFlash-0.5)*15+3;
      ctx.fillStyle=`rgba(255,${Math.floor(100+e*20)},0,${explFlash})`;
      ctx.shadowColor='#ff4400';ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(explX+Math.cos(angle)*dist,explY+Math.sin(angle)*dist,2.5,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
  }

  // Demo score popup "+200" near explosion (fading)
  const scoreFade=Math.sin(t*10);
  if(scoreFade>0.3){
    ctx.textAlign='center';
    const scoreAlpha=(scoreFade-0.3)/0.7;
    ctx.fillStyle=`rgba(255,255,68,${scoreAlpha})`;
    ctx.font='bold 14px monospace';ctx.shadowColor='#ff4';ctx.shadowBlur=8;
    const scoreY=crawlY-25+(t*10)%20; // rising text
    ctx.fillText('+200',crawlX,scoreY);
    ctx.shadowBlur=0;ctx.textAlign='start';
  }

  // Demo bullet (firing upward toward centipede)
  const bulletY=crawlY-30+Math.sin(t*8)*10;
  ctx.shadowColor='#fff';ctx.shadowBlur=14;
  ctx.strokeStyle='#fff';ctx.lineWidth=3.5;
  ctx.beginPath();ctx.moveTo(crawlX-60,bulletY+14);ctx.lineTo(crawlX-60,bulletY-6);ctx.stroke();
  ctx.shadowBlur=8;
  ctx.strokeStyle='rgba(255,200,50,0.6)';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(crawlX-60,bulletY+8);ctx.lineTo(crawlX-60,bulletY-2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(crawlX-60,bulletY-6,2.5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // Saucer fire (downward bolt from saucer)
  const saucFireY=saucerY+10+Math.sin(t*6)*8;
  ctx.shadowColor='#ff2200';ctx.shadowBlur=12;
  ctx.strokeStyle='#ff2200';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(saucerX+12,saucFireY-6);ctx.lineTo(saucerX+12,saucFireY+8);ctx.stroke();
  ctx.fillStyle='#ffcc00';ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(saucerX+12,saucFireY+8,2.5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // Demo player gunner (bottom center)
  const gunX=crawlX-60,gunY=FIELD_H-40;
  ctx.shadowColor='#2288ff';ctx.shadowBlur=8;
  ctx.strokeStyle='#2288ff';ctx.lineWidth=2;
  ctx.beginPath();ctx.rect(gunX-4,gunY-2,8,10);ctx.stroke();
  ctx.beginPath();ctx.arc(gunX,gunY-5,4,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#44aaff';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(gunX,gunY-9);ctx.lineTo(gunX,gunY-18);ctx.stroke();
  ctx.fillStyle='#88ccff';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(gunX,gunY-18,2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();

  // Score table below field (authentic Atari cabinet style)
  const scoreStartY=fieldTop+FIELD_H*attractScale+10;
  ctx.textAlign='left';
  ctx.font='bold 10px monospace';
  const scores=[['CENTIPEDE SEGMENT','10'],['CENTIPEDE HEAD','100'],['SCORPION','100'],['SPIDER','75'],['FLEA','50'],['FLYING SAUCER','250']];
  scores.forEach((s,i)=>{
    const yy=scoreStartY+i*14;
    // Left column: item name with subtle glow
    ctx.shadowColor='#8f8';ctx.shadowBlur=4;
    ctx.fillStyle='#8f8';ctx.fillText(s[0],W/2-150,yy);
    // Right column: score value in bright yellow
    ctx.shadowColor='#ff4';ctx.shadowBlur=6;
    ctx.fillStyle='#ff4';ctx.fillText(s[1],W/2+130,yy);
    // CRT phosphor glow: faint afterimage
    ctx.fillStyle='rgba(255,255,68,0.1)';ctx.shadowBlur=12;
    ctx.fillText(s[1],W/2+130,yy);
  });
  ctx.shadowBlur=0;

  // Atari logo (centered, iconic style)
  ctx.textAlign='center';
  const atariY=scoreStartY-10;
  ctx.shadowColor='#ff8';ctx.shadowBlur=8;
  ctx.fillStyle='#ff8';ctx.font='bold 12px monospace';
  const logo='ATARI',logoW=ctx.measureText(logo).width;
  ctx.fillText(logo,W/2,atariY);
  // Atari chevron mark
  ctx.strokeStyle='#ff8';ctx.lineWidth=1.5;ctx.shadowBlur=4;
  ctx.beginPath();ctx.moveTo(W/2-10,atariY-2);ctx.lineTo(W/2-5,atariY+3);ctx.lineTo(W/2,atariY-1);ctx.lineTo(W/2+5,atariY+3);ctx.lineTo(W/2+10,atariY-2);ctx.stroke();
  ctx.shadowBlur=0;

  // High score (prominent display)
  if(highScore>0){
    ctx.textAlign='center';
    ctx.fillStyle='#ff0';ctx.font='bold 12px monospace';ctx.shadowColor='#ff0';ctx.shadowBlur=8;
    const hs='HIGH SCORE: '+highScore,hsw=ctx.measureText(hs).width;
    ctx.fillText(hs,W/2,scoreStartY+scores.length*14+16);ctx.shadowBlur=0;
  }

  // Coin counter (authentic arcade cabinet style)
  const coinY=H-promptH-8;
  ctx.textAlign='center';
  // Coin slots (two circles)
  for(let c=0;c<2;c++){
    const cx=W/2-15+c*30;
    ctx.strokeStyle='#888';ctx.lineWidth=1.5;ctx.shadowColor='#888';ctx.shadowBlur=3;
    ctx.beginPath();ctx.arc(cx,coinY-4,6,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(136,136,136,0.2)';ctx.fill();
    // Coin slot line
    ctx.beginPath();ctx.moveTo(cx-3,coinY-4);ctx.lineTo(cx+3,coinY-4);ctx.stroke();
  }
  ctx.shadowBlur=0;

  // Scrolling "INSERT COIN" marquee text (authentic arcade)
  const marqueeText='INSERT COIN';
  ctx.font='bold 10px monospace';
  const marqueeW=ctx.measureText(marqueeText).width;
  const marqueeX=W/2-marqueeW/2+Math.sin(performance.now()/800)*3;
  const marqueeBlink=Math.sin(performance.now()/300)>-0.5;
  if(marqueeBlink){
    ctx.fillStyle='rgba(255,200,0,0.6)';ctx.shadowColor='#fc0';ctx.shadowBlur=4;
    ctx.fillText(marqueeText,marqueeX,coinY-18);
    ctx.shadowBlur=0;
  }

  // Copyright + player text (authentic Atari style)
  ctx.textAlign='center';
  ctx.fillStyle='#666';ctx.font='8px monospace';ctx.shadowBlur=0;
  const copyrightY=scoreStartY+scores.length*14+35;
  ctx.fillText('COPYRIGHT 1981 ATARI, INC.',W/2,copyrightY);
  ctx.fillText('1 PLAYER    2 PLAYERS',W/2,copyrightY+10);

  // Blinking start prompt at bottom (authentic arcade style)
  const blink=Math.sin(performance.now()/250)>0;
  if(blink){
    ctx.textAlign='center';
    // Multi-layer glow for "PRESS SPACE OR TAP TO START"
    ctx.shadowColor='#ff4';ctx.shadowBlur=20;
    ctx.strokeStyle='#ff4';ctx.lineWidth=3;ctx.font='bold 16px monospace';
    const st='PRESS SPACE OR TAP TO START',stw=ctx.measureText(st).width;
    ctx.strokeText(st,W/2,H-promptH+14);

    ctx.shadowBlur=8;ctx.lineWidth=1.5;
    ctx.strokeText(st,W/2,H-promptH+14);

    const promptGrad=ctx.createLinearGradient(W/2-stw/2,H-promptH-2,W/2+stw/2,H-promptH+14);
    promptGrad.addColorStop(0,'rgba(255,255,68,0.3)');
    promptGrad.addColorStop(0.5,'rgba(255,255,68,0.7)');
    promptGrad.addColorStop(1,'rgba(255,255,68,0.3)');
    ctx.fillStyle=promptGrad;
    ctx.fillText(st,W/2,H-promptH+14);
    ctx.shadowBlur=0;
    ctx.textAlign='start';
  }
}

// === Wave clear message with animation (enhanced CRT-styled overlay) ===
function drawWaveClear(){
  if(waveClearMsg&&waveClearFrames>0){
    // CRT phosphor ghosting on wave clear text (faint afterimage)
    ctx.textAlign='center';
    ctx.fillStyle='rgba(68,255,68,0.08)';ctx.shadowBlur=40;
    ctx.font='bold 32px monospace';
    ctx.fillText(waveClearMsg,W/2+2,H/2-28); // slight offset ghost
    ctx.fillStyle='rgba(68,255,68,0.05)';
    ctx.fillText(waveClearMsg,W/2-1,H/2-32); // double ghost
    // Multi-layer glowing text (CRT phosphor effect)
    const pulse=Math.sin(performance.now()/100)*5;
    ctx.textAlign='center';

    // Outer glow (wide, green)
    ctx.shadowColor='#4f4';ctx.shadowBlur=30+pulse;
    ctx.strokeStyle='#4f4';ctx.lineWidth=4;ctx.font='bold 32px monospace';
    const tw=ctx.measureText(waveClearMsg).width;
    ctx.strokeText(waveClearMsg,W/2,H/2-30);

    // Inner glow
    ctx.shadowBlur=15+pulse;ctx.lineWidth=2;
    ctx.strokeText(waveClearMsg,W/2,H/2-30);

    // Fill with gradient
    const wcGrad=ctx.createLinearGradient(W/2-tw/2,H/2-45,W/2+tw/2,H/2-15);
    wcGrad.addColorStop(0,'rgba(68,255,68,0.3)');
    wcGrad.addColorStop(0.5,'rgba(68,255,68,0.6)');
    wcGrad.addColorStop(1,'rgba(68,255,68,0.3)');
    ctx.fillStyle=wcGrad;
    ctx.fillText(waveClearMsg,W/2,H/2-30);

    ctx.shadowBlur=0;
  }

  if(nextWaveDelay>0){
    // "NEXT WAVE" blinking with CRT glow
    const blink=Math.sin(performance.now()/200)>0; // faster blink
    if(blink){
      ctx.textAlign='center';
      ctx.shadowColor='#ff4';ctx.shadowBlur=20;
      ctx.strokeStyle='#ff4';ctx.lineWidth=3;ctx.font='bold 24px monospace';
      const nw='NEXT WAVE',nw2=ctx.measureText(nw).width;
      ctx.strokeText(nw,W/2,H/2);

      ctx.shadowBlur=10;ctx.lineWidth=1.5;
      ctx.strokeText(nw,W/2,H/2);

      ctx.fillStyle='rgba(255,255,68,0.5)';
      ctx.fillText(nw,W/2,H/2);

      ctx.shadowBlur=0;
    }
  }
  ctx.textAlign='start';
}

// === Game over screen with arcade styling (enhanced) ===
function drawGameOver(){
  // Semi-transparent dark overlay
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);

  ctx.shadowColor='#ff2200';ctx.shadowBlur=30;

  ctx.textAlign='center';
  const goText='GAME OVER',goW=ctx.measureText(goText).width;

      const nh='NEW HIGH SCORE!',nhw=ctx.measureText(nh).width;

    const rt='PRESS SPACE OR TAP TO START',rtW=ctx.measureText(rt).width;
