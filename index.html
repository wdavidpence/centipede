<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Centipede</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Courier New",monospace}
canvas{display:block;width:100%;height:100%}
#debug{position:fixed;top:0;left:0;background:rgba(0,0,0,.8);color:#0f0;font-size:10px;padding:4px;z-index:10;white-space:pre;line-height:1.3;display:none}
.btn{position:fixed;z-index:5;width:76px;height:76px;border-radius:50%;background:rgba(10,30,20,.8);color:#8f9;font-size:24px;display:none;align-items:center;justify-content:center}
.left{left:12px;bottom:24px}.right{left:104px;bottom:24px}.fire{right:12px;bottom:24px}
@media(pointer:coarse){.btn{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="btn left">&#9664;</div>
<div class="btn right">&#9654;</div>
<div class="btn fire">&#8226;</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

let W,H,ship,bullets=[],centipedes=[],mushrooms=[],scorpions=[],saucers=[],spiders=[],saucerBullets=[];
let score=0,lives=3,wave=1,gameOver=false;
let keys={left:false,right:false,fire:false};
let particles=[],floatText=[];
let waveClearMsg='',waveClearFrames=0,nextWaveDelay=0;

// Game state machine
let gameState='attract'; // 'attract','playing','gameover'

// Invincibility frames after losing a life
let invincibleTimer=0;

// High score persistence
let highScore=parseInt(localStorage.getItem('centipede_highscore')||'0');

// Extra life tracking
let extraLifeScore=0;

// Configuration - all coordinates are FIELD-RELATIVE (origin at top-left of play area)
const FIELD_W=240; // Game logic always runs at this reference width
const FIELD_H=500; // Fixed field height in game coords
const GRID_COLS=30;
const GRID_ROWS=28;

// Fire rate config
const FIRE_COOLDOWN=8;
let fireTimer=0;

// Field offset (where the play area starts on screen)
const OY=30; // top margin for HUD

// Dynamic scale and offset computed from screen size
let SCALE=1,OX=0;

function resize(){
  W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;
  // Scale field to fit screen with some margins
  const availW=W-40, availH=H-OY*2;
  SCALE=Math.min(availW/FIELD_W, availH/FIELD_H, 4); // max 4x
  OX=(W-FIELD_W*SCALE)/2;
}
window.addEventListener('resize',function(){
  resize();
  if(ship&&gameState==='playing'){
    ship.y=FIELD_H-30; // keep ship at field bottom
  }
});

// === Audio engine ===
let audioCtx=null;
function getAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}

function playSound(type){
  try{
    const ac=getAudio();if(!ac)return;
    const now=ac.currentTime;
    if(type==='shoot'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='square';
      o.frequency.setValueAtTime(1200,now);o.frequency.exponentialRampToValueAtTime(400,now+0.08);
      g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.08);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.08);
    }else if(type==='explode'){
      const bufSize=ac.sampleRate*0.3;const buf=ac.createBuffer(1,bufSize,ac.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,3);
      const s=ac.createBufferSource();const g=ac.createGain();s.buffer=buf;
      g.gain.setValueAtTime(0.2,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
      s.connect(g).connect(ac.destination);s.start(now);
    }else if(type==='hit'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='square';
      o.frequency.setValueAtTime(600,now);o.frequency.exponentialRampToValueAtTime(150,now+0.12);
      g.gain.setValueAtTime(0.1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.12);
    }else if(type==='waveclear'){
      [523,659,784,1047,1318].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='square';o.frequency.value=f;
        g.gain.setValueAtTime(0.07,now+i*0.1);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.1+0.15);
        o.connect(g).connect(ac.destination);o.start(now+i*0.1);o.stop(now+i*0.1+0.15);
      });
    }else if(type==='gameover'){
      [400,350,300,250,200].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='sawtooth';o.frequency.value=f;
        g.gain.setValueAtTime(0.1,now+i*0.25);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.25+0.2);
        o.connect(g).connect(ac.destination);o.start(now+i*0.25);o.stop(now+i*0.25+0.22);
      });
    }else if(type==='hurt'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='sawtooth';
      o.frequency.setValueAtTime(400,now);o.frequency.exponentialRampToValueAtTime(80,now+0.4);
      g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.4);
    }else if(type==='mushroom'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='triangle';
      o.frequency.setValueAtTime(800,now);o.frequency.exponentialRampToValueAtTime(400,now+0.04);
      g.gain.setValueAtTime(0.05,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.04);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.04);
    }else if(type==='saucer'){
      const o=ac.createOscillator();const g=ac.createGain();o.type='sine';
      o.frequency.setValueAtTime(300,now);o.frequency.linearRampToValueAtTime(600,now+0.15);
      o.frequency.linearRampToValueAtTime(300,now+0.3);
      g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
      o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.3);
    }else if(type==='bonus'){
      [784,988,1175,1568].forEach((f,i)=>{
        const o=ac.createOscillator();const g=ac.createGain();o.type='square';o.frequency.value=f;
        g.gain.setValueAtTime(0.08,now+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.1);
        o.connect(g).connect(ac.destination);o.start(now+i*0.08);o.stop(now+i*0.08+0.12);
      });
    }
  }catch(e){}
}

// === Utility functions - all use field-relative coords, convert to screen in draw ===
function addParticles(fx,fy,color,count){
  for(let i=0;i<count;i++)particles.push({x:fx,y:fy,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:20+Math.random()*15,color,size:2+Math.random()*3});
}

function addFloatText(fx,fy,text,color){
  floatText.push({x:fx,y:fy,text:typeof text==='string'?[text]:text,color:color||'#ff0',life:60,vy:-1});
}

// === Input handling ===
document.addEventListener('keydown',function(e){
  if(gameState==='attract'&&(e.key===' '||e.key==='Enter')){
    e.preventDefault();getAudio();startGame();return;
  }
  if(gameState==='gameover'&&e.key===' '){startGame();return;}
  if(e.key==='ArrowLeft')keys.left=true;
  if(e.key==='ArrowRight')keys.right=true;
  if(e.key==='ArrowUp')keys.up=true;
  if(e.key==='ArrowDown')keys.down=true;
  if(e.key===' ')keys.fire=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')keys.left=false;
  if(e.key==='ArrowRight')keys.right=false;
  if(e.key==='ArrowUp')keys.up=false;
  if(e.key==='ArrowDown')keys.down=false;
  if(e.key===' ')keys.fire=false;
});

document.querySelector('.btn.left').addEventListener('touchstart',function(e){e.preventDefault();keys.left=true;},{passive:false});
document.querySelector('.btn.left').addEventListener('touchend',function(e){e.preventDefault();keys.left=false;},{passive:false});
document.querySelector('.btn.right').addEventListener('touchstart',function(e){e.preventDefault();keys.right=true;},{passive:false});
document.querySelector('.btn.right').addEventListener('touchend',function(e){e.preventDefault();keys.right=false;},{passive:false});
document.querySelector('.btn.fire').addEventListener('touchstart',function(e){e.preventDefault();keys.fire=true;},{passive:false});
document.querySelector('.btn.fire').addEventListener('touchend',function(e){e.preventDefault();keys.fire=false;},{passive:false});

// Touch/click to start from attract screen
canvas.addEventListener('touchstart',function(e){
  if(gameState==='attract'){e.preventDefault();getAudio();startGame();return;}
  if(gameState==='gameover'){e.preventDefault();startGame();}
},{passive:false});
canvas.addEventListener('click',function(e){
  if(gameState==='attract'){getAudio();startGame();return;}
  if(gameState==='gameover'){startGame();}
});

// === Game initialization ===
function startGame(){
  score=0;lives=3;wave=1;gameOver=false;
  bullets=[];centipedes=[];mushrooms=[];scorpions=[];saucers=[];spiders=[];particles=[];floatText=[];
  waveClearMsg='';waveClearFrames=0;nextWaveDelay=0;
  invincibleTimer=0;fireTimer=0;extraLifeScore=0;saucerTimer=0;
  // Ship position: field-relative (bottom of play area)
  ship={x:FIELD_W/2,y:FIELD_H-30};
  spawnMush();spawnCenti();
  gameState='playing';
}

// === Centipede spawning (field-relative) ===
function spawnCenti(offset){
  offset=offset||0;
  const segCount=Math.min(15+wave*2,24); // original: 15 on wave 1, +2 per wave, max 24
  const fromLeft=(wave%2===1);
  const dirX=fromLeft?1:-1;
  const startX=fromLeft?-5:FIELD_W+5;
  // Original Centipede: odd waves fast, even waves slow
  const isFastWave = (wave % 2 === 1);
  // Fast waves: ~2px/frame, slow waves: ~0.75px/frame (authentic pacing)
  const spd = isFastWave ? 2.0 : 0.75;
  const segGap=8;

  const segs=[];
  for(let i=0;i<segCount;i++){
    // Spawn at top of field with offset for staggering
    segs.push({x:startX-i*segGap*dirX,y:5+i*2+offset,w:7,h:5});
  }
  const trail=[];
  for(let i=0;i<segCount*2+10;i++){
    trail.push({x:startX-i*spd*dirX,y:5+i*2+offset});
  }
  centipedes.push({segs,dirX,speed:spd,mushCooldown:0,trail});
}

function spawnMush(){
  // Grid-based mushroom placement for authentic ~65% density
  const cellW=FIELD_W/GRID_COLS;
  const cellH=(FIELD_H-60)/GRID_ROWS; // leave room for HUD and player zone
  const startY=35;

  for(let r=0;r<GRID_ROWS-3;r++){ // leave bottom 3 rows clear for player
    for(let c=0;c<GRID_COLS;c++){
      // Seeded random: ~65% fill, with some empty spaces for movement paths
      let seed=r*GRID_COLS+c+42;
      seed=(seed*1103515245+12345)&0x7fffffff;
      if((seed%100)<65){
        const spots=[];
        for(let s=0;s<3;s++){
          seed=(seed*1103515245+12345)&0x7fffffff;
          const angle=Math.PI+(seed%360)/360*Math.PI;
          seed=(seed*1103515245+12345)&0x7fffffff;
          const dist=cellW*0.3+s*1.2;
          spots.push({angle,dist});
        }
        mushrooms.push({x:c*cellW+cellW/2,y:startY+r*cellH,w:cellW*0.8,h:cellH*0.9,hp:4,spots,centiHitTimer:0});
      }
    }
  }
}

// === Centipede update (field-relative) ===
function updateCenti(c){
  const head=c.segs[0];
  if(!c.mushCooldown)c.mushCooldown=0;

  // Record head's current position in trail buffer (before moving)
  if(!c.trail)c.trail=[];
  c.trail.unshift({x:head.x,y:head.y});
  if(c.trail.length>c.segs.length*3+20)c.trail.pop();

  // Move head horizontally
  head.x+=c.dirX*c.speed;

  // Slow downward progression (1px every 8 frames)
  c.mushCooldown++;
  if(c.mushCooldown%8===0){head.y+=1;}

  // Mushroom collision - turn and drop down (head only)
  for(let i=0;i<mushrooms.length;i++){
    const m=mushrooms[i];
    if(head.x+head.w/2>m.x-m.w/2&&head.x-head.w/2<m.x+m.w/2&&
       head.y+head.h/2>m.y-m.h/2&&head.y-head.h/2<m.y+m.h/2){
      if(c.mushCooldown>15){c.dirX*=-1;head.y+=16;c.mushCooldown=0;break;}
    }
  }

  // Wall bounce - reverse and drop down
  if(head.x<-10||head.x>FIELD_W+10){c.dirX*=-1;head.y+=8;}

  // BUG FIX #13: Body segments follow trail with proper spacing
  for(let i=1;i<c.segs.length;i++){
    const trailIdx=i*2;
    if(trailIdx<c.trail.length){
      c.segs[i].x=c.trail[trailIdx].x;
      c.segs[i].y=c.trail[trailIdx].y;
    }else{
      // If trail is too short, position behind previous segment
      const prev=c.segs[i-1];
      c.segs[i].x=prev.x-c.dirX*8;
      c.segs[i].y=prev.y+2;
    }
  }

  // Only head damages mushrooms, with cooldown per mushroom
  const seg=c.segs[0];
  for(let mi=mushrooms.length-1;mi>=0;mi--){
    const m=mushrooms[mi];
    if(Math.hypot(seg.x-m.x,seg.y-m.y)<m.w/2+4){
      if(!m.centiHitTimer||m.centiHitTimer<=0){
        m.hp--;if(m.hp<=0)mushrooms.splice(mi,1);else{m.w*=0.75;m.h*=0.75;}
        m.centiHitTimer=30; // 30-frame cooldown per mushroom
      }
    }
    if(m.centiHitTimer)m.centiHitTimer--;
  }

  // BUG FIX #19: Body segments reaching bottom become mushrooms
  for(let i=c.segs.length-1;i>=1;i--){
    const fieldBottom=FIELD_H-20;
    if(c.segs[i].y>fieldBottom){
      const fallen=c.segs.splice(i,1)[0];
      // Create a new mushroom where the segment fell
      mushrooms.push({x:fallen.x,y:fieldBottom-5,w:14,h:16,hp:4,spots:[],centiHitTimer:0});
      addParticles(fallen.x,fallen.y,'#3a8030',4);
    }
  }

  // Game over check: field-relative bottom of play area
  const fieldBottom=FIELD_H-20; // field height minus margin
  if(head.y>fieldBottom){gameOver=true;}
}

// === Scorpion mechanics ===
// Scorpions emerge from centipede heads when shot. They seek the player while
// avoiding mushrooms. In the original, they appear after a delay (head stays
// on screen as a "cocoon" then the scorpion bursts out).

function spawnScorpion(x,y){
  // Scorpion emerges after a brief delay (cocoon phase)
  scorpions.push({
    x, y,
    w:10, h:8,
    speed:2.5 + Math.min(wave*0.15, 3), // speed scales with wave
    state: 'cocoon', // 'cocoon','emerging','moving'
    timer: 60, // frames before emerging (1 second)
    dirX: (Math.random()>0.5?1:-1),
    dirY: 1,
    pauseTimer: 0,
    animPhase: Math.random()*Math.PI*2
  });
}

function updateScorpion(s){
  if(s.state==='cocoon'){
    s.timer--;
    if(s.timer<=0){
      s.state='emerging';
      s.timer=15; // brief emergence animation
    }
    return;
  }

  if(s.state==='emerging'){
    s.timer--;
    if(s.timer<=0){
      s.state='moving';
    }
    return;
  }

  // Moving state - seek player with mushroom avoidance
  if(s.pauseTimer>0){s.pauseTimer--;return;}

  // Target: player position (field-relative)
  const targetX=ship.x;
  const targetY=ship.y;

  // Calculate direction toward player
  const dx=targetX-s.x;
  const dy=targetY-s.y;
  const dist=Math.hypot(dx,dy);

  if(dist>5){
    // Normalize direction
    const ndx=dx/dist;
    const ndy=dy/dist;

    // Scorpions move diagonally toward player but snap to 8 directions
    let moveX=0, moveY=0;
    if(Math.abs(ndx)>Math.abs(ndy)){
      moveX=ndx>0?1:-1;
      moveY=ndy*0.5; // slower vertical component
    }else{
      moveY=ndy>0?1:-1;
      moveX=ndx*0.5;
    }

    // Check mushroom collision at target position
    let blocked=false;
    const nextX=s.x+moveX*s.speed;
    const nextY=s.y+moveY*s.speed;
    for(let i=0;i<mushrooms.length&&!blocked;i++){
      const m=mushrooms[i];
      if(Math.hypot(nextX-m.x,nextY-m.y)<m.w/2+5){blocked=true;}
    }

    if(!blocked){
      s.x=nextX;
      s.y=nextY;
    }else{
      // Try going around - switch horizontal direction
      s.x-=s.dirX*s.speed;
      s.y+=s.speed*0.5;
      s.dirX*=-1;
      s.pauseTimer=10; // brief pause when blocked
    }
  }

  // Keep in bounds
  if(s.x<5){s.x=5;s.dirX=1;}
  if(s.x>FIELD_W-5){s.x=FIELD_W-5;s.dirX=-1;}

  // Animate
  s.animPhase+=0.15;

  // Game over if scorpion reaches bottom
  const fieldBottom=FIELD_H-20;
  if(s.y>fieldBottom){gameOver=true;}
}

// Draw scorpion with vector-style graphics
function drawScorpion(s){
  const sx=s.x, sy=s.y;
  const t=performance.now()/150;

  if(s.state==='cocoon'){
    // Cocoon: pulsating centipede head remnant
    const pulse=Math.sin(t*2)*3;
    ctx.shadowColor='#ff4400';ctx.shadowBlur=8+pulse;
    ctx.strokeStyle='#ff4400';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,sy,6+pulse/2,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,68,0,0.3)';
    ctx.fill();
    ctx.shadowBlur=0;
    return;
  }

  if(s.state==='emerging'){
    // Bursts out with particles
    const burst=15-s.timer;
    const scale=burst/15;
    ctx.shadowColor='#ff8800';ctx.shadowBlur=15*scale;
    ctx.strokeStyle='#ff8800';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,sy,8+scale*5,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
    return;
  }

  // Full scorpion - vector style
  const legAnim=Math.sin(s.animPhase)*3;

  // Body glow
  ctx.shadowColor='#ff6600';ctx.shadowBlur=10;
  ctx.strokeStyle='#ff6600';ctx.lineWidth=2;

  // Main body (oval)
  ctx.beginPath();ctx.ellipse(sx,sy,6,5,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,102,0,0.3)';
  ctx.fill();

  // Tail (curved upward behind)
  const tailCurl=Math.sin(s.animPhase*0.7)*4;
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(sx,sy+5);
  ctx.quadraticCurveTo(sx+tailCurl,sy+12,sx+tailCurl*1.5,sy+10);
  ctx.quadraticCurveTo(sx+tailCurl*2,sy+6,sx+tailCurl*1.5,sy+3);
  ctx.stroke();

  // Stinger tip
  ctx.fillStyle='#ffaa00';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(sx+tailCurl*1.5,sy+3,2,0,Math.PI*2);ctx.fill();

  // Pincers (front)
  const pincerOpen=Math.sin(s.animPhase*1.3)*2+4;
  ctx.strokeStyle='#ff6600';ctx.lineWidth=1.5;ctx.shadowBlur=6;
  ctx.beginPath();
  ctx.moveTo(sx-3,sy-4);ctx.lineTo(sx-6-pincerOpen,sy-8);
  ctx.moveTo(sx+3,sy-4);ctx.lineTo(sx+6+pincerOpen,sy-8);
  ctx.stroke();

  // Pincer tips
  ctx.fillStyle='#ffaa00';
  ctx.beginPath();ctx.arc(sx-6-pincerOpen,sy-8,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+6+pincerOpen,sy-8,1.5,0,Math.PI*2);ctx.fill();

  // Animated legs (4 pairs)
  ctx.strokeStyle='#ff6600';ctx.lineWidth=1;ctx.shadowBlur=4;
  for(let i=0;i<4;i++){
    const ly=sy-3+i*2.5;
    const lAnim=Math.sin(s.animPhase+i*0.8)*legAnim;
    // Left legs
    ctx.beginPath();ctx.moveTo(sx-5,ly);ctx.lineTo(sx-8-lAnim,ly+3);ctx.stroke();
    // Right legs
    ctx.beginPath();ctx.moveTo(sx+5,ly);ctx.lineTo(sx+8+lAnim,ly+3);ctx.stroke();
  }

  // Eyes
  ctx.fillStyle='#fff';ctx.shadowBlur=3;
  ctx.beginPath();ctx.arc(sx-2,sy-3,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+2,sy-3,1.5,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
}

// === Flying Saucer mechanics ===
// Saucers appear at the top of the screen, move horizontally, and drop spiders.
// In the original, they appear from wave 3+.

let saucerTimer=0;
const SAUCER_INTERVAL=480; // spawn saucer every 8 seconds (at wave 3+)

function spawnSaucer(){
  const fromLeft=Math.random()>0.5;
  saucers.push({
    x: fromLeft?-30:FIELD_W+30,
    y: 15, // top of field
    dirX: fromLeft?2.5:-2.5,
    speed: 2.5+Math.min(wave*0.1,2),
    dropTimer: 60+Math.random()*120, // when to drop spider
    animPhase: 0,
    alive: true
  });
}

function updateSaucer(s){
  s.x+=s.dirX;
  s.animPhase+=0.1;

  // Drop spider after timer
  s.dropTimer--;
  if(s.dropTimer<=0&&spiders.length<3+Math.floor(wave/2)){
    // Drop spider at saucer position
    spiders.push({
      x: s.x,
      y: s.y+10,
      w: 10, h: 8,
      speed: 2+Math.min(wave*0.1,2),
      state: 'falling', // 'falling','jumping'
      fallSpeed: 3,
      jumpTimer: 0,
      dirX: (Math.random()>0.5?1:-1),
      animPhase: Math.random()*Math.PI*2,
      legAnim: 0
    });
    s.dropTimer=90+Math.random()*120; // cooldown before next drop
  }

  // Saucer shoots at player (original mechanic)
  if(!s.shootTimer)s.shootTimer=30+Math.random()*60;
  s.shootTimer--;
  if(s.shootTimer<=0){
    // Fire a bullet downward toward player
    saucerBullets.push({x:s.x, y:s.y+10, dy:4, life:200});
    s.shootTimer=40+Math.random()*80;
  }

  // Remove if off screen
  if(s.x<-50||s.x>FIELD_W+50)s.alive=false;
}

function drawSaucer(s){
  const sx=s.x, sy=s.y;
  const t=s.animPhase;

  // Glow
  ctx.shadowColor='#ff00ff';ctx.shadowBlur=12;

  // Saucer body (vector-style dome)
  ctx.strokeStyle='#ff00ff';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(sx,sy,15,6,0,Math.PI,0); // top dome
  ctx.stroke();
  ctx.fillStyle='rgba(255,0,255,0.2)';
  ctx.fill();

  // Base ring
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(sx,sy,15,3,0,0,Math.PI*2);ctx.stroke();

  // Center light
  const lightPulse=Math.sin(t*3)*0.5+0.5;
  ctx.fillStyle=`rgba(255,255,255,${0.5+lightPulse*0.5})`;ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(sx,sy-2,2,0,Math.PI*2);ctx.fill();

  // Edge lights
  ctx.fillStyle=`rgba(255,100,255,${0.3+lightPulse*0.4})`;
  ctx.beginPath();ctx.arc(sx-12,sy,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+12,sy,1.5,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
}

// === Spider mechanics ===
// Spiders are dropped by saucers. They jump toward the player and destroy
// mushrooms on contact. In the original, they're worth 75 points.

function updateSpider(s){
  if(s.state==='falling'){
    s.y+=s.fallSpeed;
    // When it reaches the field, start jumping
    if(s.y>30){
      s.state='jumping';
      s.jumpTimer=0;
    }
    return;
  }

  // Jumping state - seek player with hopping movement
  s.animPhase+=0.12;
  s.legAnim+=0.2;

  if(s.jumpTimer>0){s.jumpTimer--;return;}

  // Move toward player (field-relative)
  const dx=ship.x-s.x;
  const dy=ship.y-s.y;
  const dist=Math.hypot(dx,dy);

  if(dist>8){
    let moveX=(dx/dist)*s.speed;
    let moveY=(dy/dist)*s.speed*0.6;

    // Check mushroom collision
    let blocked=false;
    for(let i=0;i<mushrooms.length&&!blocked;i++){
      const m=mushrooms[i];
      if(Math.hypot(s.x+moveX-m.x,s.y+moveY-m.y)<m.w/2+5){blocked=true;}
    }

    if(!blocked){
      s.x+=moveX;
      s.y+=moveY;
    }else{
      s.x-=s.dirX*s.speed;
      s.dirX*=-1;
    }
  }

  // Spider destroys mushrooms on contact
  for(let mi=mushrooms.length-1;mi>=0;mi--){
    const m=mushrooms[mi];
    if(Math.hypot(s.x-m.x,s.y-m.y)<m.w/2+4){
      m.hp--;
      if(m.hp<=0){
        addParticles(m.x,m.y,'#3a8030',4);
        mushrooms.splice(mi,1);
      }else{m.w*=0.8;m.h*=0.8;}
    }
  }

  // Keep in bounds
  if(s.x<5){s.x=5;s.dirX=1;}
  if(s.x>FIELD_W-5){s.x=FIELD_W-5;s.dirX=-1;}

  // Game over if spider reaches bottom
  const fieldBottom=FIELD_H-20;
  if(s.y>fieldBottom){gameOver=true;}
}

function drawSpider(s){
  const sx=s.x, sy=s.y;

  if(s.state==='falling'){
    // Falling: compressed spider shape
    ctx.shadowColor='#ff00aa';ctx.shadowBlur=8;
    ctx.strokeStyle='#ff00aa';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(sx,sy,5,3,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,0,170,0.3)';ctx.fill();
    ctx.shadowBlur=0;
    return;
  }

  // Full spider - vector style
  const legSpread=Math.sin(s.legAnim)*3;

  // Body glow
  ctx.shadowColor='#ff00aa';ctx.shadowBlur=10;
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=2;

  // Abdomen (rear)
  ctx.beginPath();ctx.ellipse(sx,sy+2,6,5,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,0,170,0.25)';ctx.fill();

  // Cephalothorax (front)
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(sx,sy-4,4,0,Math.PI*2);ctx.stroke();

  // Eyes (red glow)
  ctx.fillStyle='#ff4444';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(sx-2,sy-5,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+2,sy-5,1.5,0,Math.PI*2);ctx.fill();

  // 4 pairs of legs with walking animation
  ctx.strokeStyle='#ff00aa';ctx.lineWidth=1;ctx.shadowBlur=4;
  for(let i=0;i<4;i++){
    const phase=s.legAnim+i*0.9;
    const lAngle=Math.sin(phase)*legSpread;
    // Left legs
    ctx.beginPath();
    ctx.moveTo(sx-4,sy-i*2+1);
    ctx.quadraticCurveTo(sx-9-lAngle,sy-i*2-2,sx-11-lAngle*1.5,sy-i*2+3);
    ctx.stroke();
    // Right legs
    ctx.beginPath();
    ctx.moveTo(sx+4,sy-i*2+1);
    ctx.quadraticCurveTo(sx+9+lAngle,sy-i*2-2,sx+11+lAngle*1.5,sy-i*2+3);
    ctx.stroke();
  }

  ctx.shadowBlur=0;
}
// === Color cycling per stage (arcade authentic) ===
// Original Atari cycled through color palettes every stage.
const STAGE_COLORS = [
  {centiHead:'#ff2200', centiTail:'#44ff22', mush:'#00ff44', border:'#00ff44'},
  {centiHead:'#ff8800', centiTail:'#22ffaa', mush:'#44ff88', border:'#44ff88'},
  {centiHead:'#ff0088', centiTail:'#88ff44', mush:'#88ff44', border:'#88ff44'},
  {centiHead:'#00ff88', centiTail:'#44aaff', mush:'#44ffaa', border:'#44ffaa'},
  {centiHead:'#44aaff', centiTail:'#ff44aa', mush:'#aaff44', border:'#aaff44'},
  {centiHead:'#ffaa44', centiTail:'#44ff88', mush:'#ffaa44', border:'#ffaa44'},
];
function getSC(){return STAGE_COLORS[(wave-1)%STAGE_COLORS.length];}

function drawCenti(c){
  const t=performance.now()/200;

  for(let i=0;i<c.segs.length;i++){
    const seg=c.segs[i];
    // Convert field-relative to screen coords
    const sx=seg.x, sy=seg.y;

    if(i===0){
      // === HEAD: Same shape as body segments, different color scheme ===
      // In original Centipede, head uses identical sprite shape as body but with
      // a distinct color. The "head" is visually the same oval segment shape.
      const dir=c.dirX;
      const sc=getSC();

      ctx.shadowColor=sc.centiHead;ctx.shadowBlur=8;
      ctx.strokeStyle=sc.centiHead;ctx.lineWidth=2;

      // Same oval shape as body segments
      ctx.beginPath();ctx.ellipse(sx,sy,seg.w/2,seg.h/2+1,0,0,Math.PI*2);ctx.stroke();

      // Inner fill
      ctx.shadowBlur=4;
      const headRgba=sc.centiHead.replace('#','');
      ctx.fillStyle=`rgba(${parseInt(headRgba.slice(0,2),16)},${parseInt(headRgba.slice(2,4),16)},${parseInt(headRgba.slice(4,6),16)},0.5)`;
      ctx.beginPath();ctx.ellipse(sx,sy,seg.w/3,seg.h/4,0,0,Math.PI*2);ctx.fill();

      // Small antennae (original head had tiny feelers)
      ctx.shadowBlur=3;
      const antWave=Math.sin(t*3)*2;
      ctx.strokeStyle=sc.centiHead;ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(sx-2,sy-seg.h/2);ctx.lineTo(sx-3+antWave,sy-seg.h/2-4);
      ctx.moveTo(sx+2,sy-seg.h/2);ctx.lineTo(sx+3-antWave,sy-seg.h/2-4);
      ctx.stroke();

      ctx.shadowBlur=0;
    }else if(i===c.segs.length-1){
      // === TAIL: Slightly smaller oval with gentle wag (original style) ===
      const tailWag=Math.sin(t*4)*2;
      const sc=getSC();

      ctx.shadowColor=sc.centiTail;ctx.shadowBlur=8;
      ctx.strokeStyle=sc.centiTail;ctx.lineWidth=2;

      // Smaller oval than body segments
      ctx.beginPath();ctx.ellipse(sx+tailWag,sy,seg.w/3,seg.h/3+1,0,0,Math.PI*2);ctx.stroke();

      // Inner fill
      ctx.shadowBlur=4;
      const tailRgba=sc.centiTail.replace('#','');
      ctx.fillStyle=`rgba(${parseInt(tailRgba.slice(0,2),16)},${parseInt(tailRgba.slice(2,4),16)},${parseInt(tailRgba.slice(4,6),16)},0.4)`;
      ctx.beginPath();ctx.arc(sx+tailWag,sy,seg.w/4,0,Math.PI*2);ctx.fill();

      ctx.shadowBlur=0;
    }else{
      // === BODY SEGMENTS: Same color scheme as head, animated legs ===
      const sc=getSC();
      // Use stage head color for all body segments (original used same color)
      const segColor=sc.centiHead;

      // Animated legs - conveyor belt effect (legs phase shifts along body)
      const legPhase=t*3+i*0.8; // staggered animation creates wave effect
      const legAngle=Math.sin(legPhase)*0.5;

      ctx.shadowColor=segColor;ctx.shadowBlur=6;
      ctx.strokeStyle=segColor;ctx.lineWidth=2;

      // Segment body - vector-style oval
      ctx.beginPath();ctx.ellipse(sx,sy,seg.w/2,seg.h/2+1,0,0,Math.PI*2);ctx.stroke();

      // Inner fill
      const segRgba=sc.centiHead.replace('#','');
      ctx.fillStyle=`rgba(${parseInt(segRgba.slice(0,2),16)},${parseInt(segRgba.slice(2,4),16)},${parseInt(segRgba.slice(4,6),16)},0.3)`;
      ctx.beginPath();ctx.ellipse(sx,sy,seg.w/3,seg.h/4,0,0,Math.PI*2);ctx.fill();

      // Animated legs (vector lines below segment)
      ctx.strokeStyle=segColor;ctx.lineWidth=1;
      ctx.shadowBlur=4;
      const legLen=4;
      // Left leg
      ctx.beginPath();
      ctx.moveTo(sx-seg.w/4,sy+seg.h/4);
      ctx.lineTo(sx-seg.w/3-Math.sin(legAngle)*2,sy+seg.h/4+legLen+Math.cos(legAngle)*2);
      ctx.stroke();
      // Right leg
      ctx.beginPath();
      ctx.moveTo(sx+seg.w/4,sy+seg.h/4);
      ctx.lineTo(sx+seg.w/3+Math.sin(legAngle)*2,sy+seg.h/4+legLen-Math.cos(legAngle)*2);
      ctx.stroke();

      // Connection line to previous segment (vector-style)
      if(i>0){
        const prev=c.segs[i-1];
        ctx.strokeStyle=segColor;ctx.lineWidth=1.5;
        ctx.globalAlpha=0.6;
        ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(sx,sy);ctx.stroke();
        ctx.globalAlpha=1;
      }

      ctx.shadowBlur=0;
    }
  }
}

function drawMush(m){
  const sx=m.x, sy=m.y;
  const sc=getSC();

  // Vector-style mushroom (original had bitmap sprites with detailed stems/caps)
  ctx.shadowColor=sc.mush;ctx.shadowBlur=8;

  // Stem (vector lines)
  ctx.strokeStyle=sc.mush;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(sx-2,sy+2);ctx.lineTo(sx-2,sy+m.h/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+2,sy+2);ctx.lineTo(sx+2,sy+m.h/2);ctx.stroke();

  // Cap outline (vector arc) - original had rounded mushroom caps
  ctx.strokeStyle=sc.mush;ctx.lineWidth=2;
  ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(sx,sy,m.w/2,Math.PI,0);ctx.stroke();

  // Cap fill (subtle glow)
  const mushRgba=sc.mush.replace('#','');
  ctx.fillStyle=`rgba(${parseInt(mushRgba.slice(0,2),16)},${parseInt(mushRgba.slice(2,4),16)},${parseInt(mushRgba.slice(4,6),16)},0.2)`;
  ctx.beginPath();ctx.arc(sx,sy,m.w/2,Math.PI,0);ctx.fill();

  // Spots on cap (white dots) - original had detailed white spots
  ctx.shadowBlur=4;
  ctx.fillStyle='#ffffff';
  if(m.spots){
    for(let i=0;i<m.spots.length;i++){
      const sp=m.spots[i];
      ctx.beginPath();
      ctx.arc(sx+Math.cos(sp.angle)*sp.dist,sy+Math.sin(sp.angle)*sp.dist*0.5-2,1.5,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Damage indicators (original didn't show damage, mushrooms just shrank)
  ctx.shadowBlur=0;
}

function drawShip(s){
  const sx=s.x, sy=s.y;

  // Blink when invincible
  if(invincibleTimer>0&&Math.floor(invincibleTimer/4)%2===0)return;

  // Player: "somewhat humanoid head" - Atari authentic
  // Original Centipede player is a small face/head shape with a gun barrel
  ctx.shadowColor='#2288ff';ctx.shadowBlur=10;
  ctx.strokeStyle='#2288ff';ctx.lineWidth=2;

  // Head outline (oval)
  ctx.beginPath();ctx.ellipse(sx,sy,6,7,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(34,136,255,0.3)';
  ctx.fill();

  // Eyes (two dots)
  ctx.fillStyle='#fff';ctx.shadowBlur=4;
  ctx.beginPath();ctx.arc(sx-2,sy-2,1.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+2,sy-2,1.5,0,Math.PI*2);ctx.fill();

  // Mouth (small line)
  ctx.strokeStyle='#66bbff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(sx-2,sy+3);ctx.lineTo(sx+2,sy+3);ctx.stroke();

  // Gun barrel pointing up
  ctx.shadowColor='#44aaff';ctx.shadowBlur=6;
  ctx.strokeStyle='#44aaff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(sx,sy-7);ctx.lineTo(sx,sy-14);ctx.stroke();

  // Gun tip
  ctx.fillStyle='#88ccff';
  ctx.beginPath();ctx.arc(sx,sy-14,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(sx,sy-10);ctx.lineTo(sx,sy-16);ctx.stroke();
  ctx.beginPath();ctx.arc(sx,sy-16,1,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
}

function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];ctx.globalAlpha=p.life/35;
    ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.fillStyle=p.color;
    // Convert field-relative to screen coords
    ctx.beginPath();ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function drawFloatText(){
  for(let i=0;i<floatText.length;i++){
    const ft=floatText[i];ctx.globalAlpha=Math.min(1,ft.life/20);
    ctx.shadowColor=ft.color;ctx.shadowBlur=8;
    ctx.fillStyle=ft.color;ctx.font='bold 12px monospace';
    // Convert field-relative to screen coords
    for(let j=0;j<ft.text.length;j++){ctx.fillText(ft.text[j],ft.x,ft.y-j*14);}
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

// === Background grid pattern (arcade authentic vector style) ===
function drawBackground(){
  // Pure black background (original had no visible grid)
  ctx.fillStyle='#000';ctx.fillRect(0,0,FIELD_W,FIELD_H);
}

// === Bullet drawing with glow effect (field-relative) ===
function drawBullet(b){
  const sx=b.x, sy=b.y;

  // Vector-style bullet (bright line with glow)
  ctx.shadowColor='#ffaa22';ctx.shadowBlur=10;
  ctx.strokeStyle='#ffaa22';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy-8);ctx.stroke();

  // Bullet core (bright white)
  ctx.shadowBlur=6;
  ctx.fillStyle='#ffff88';
  ctx.beginPath();ctx.arc(sx,sy-4,1.5,0,Math.PI*2);ctx.fill();

  // Trail effect
  ctx.globalAlpha=0.5;ctx.strokeStyle='#ff8844';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(sx,sy+2);ctx.lineTo(sx,sy+8);ctx.stroke();
  ctx.globalAlpha=0.25;
  ctx.beginPath();ctx.moveTo(sx,sy+8);ctx.lineTo(sx,sy+12);ctx.stroke();
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

// === Field border with glow effect ===
function drawFieldBorder(){
  // Original: always green border, not stage-dependent
  ctx.strokeStyle='#00ff44';ctx.lineWidth=2;ctx.shadowColor='#00ff44';ctx.shadowBlur=8;
  ctx.strokeRect(0,0,FIELD_W,FIELD_H);

  // Inner border (subtle)
  ctx.strokeStyle='rgba(0,255,68,0.3)';ctx.lineWidth=1;ctx.shadowBlur=4;
  ctx.strokeRect(2,2,FIELD_W-4,FIELD_H-4);

  // Corner decorations
  ctx.fillStyle='#00ff44';ctx.shadowBlur=6;const cs=5;
  ctx.fillRect(0,0,cs,cs);ctx.fillRect(FIELD_W-cs,0,cs,cs);
  ctx.fillRect(0,FIELD_H-cs,cs,cs);ctx.fillRect(FIELD_W-cs,FIELD_H-cs,cs,cs);

  ctx.shadowBlur=0;
}

// === HUD with arcade styling ===
function drawHUD(){
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.shadowColor='#fff';ctx.shadowBlur=4;
  ctx.fillText('SCORE '+score,12,OY-8);

  // Lives as small player heads (original style)

  }

  ctx.fillStyle='#4f4';ctx.font='bold 12px monospace';ctx.shadowColor='#4f4';ctx.shadowBlur=4;

  // Display actual high score
  ctx.fillStyle='#ff0';ctx.font='bold 10px monospace';ctx.shadowColor='#ff0';ctx.shadowBlur=3;
  ctx.fillText('HI '+highScore,W-80,OY+8);ctx.shadowBlur=0;
}

// === Attract/start screen ===
function drawAttract(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  const t=performance.now()/300;
  const pulse=Math.sin(t)*0.3+0.7;

  // Layout: title at top, field in middle, scores below, prompt at bottom
  const titleH=60;       // space for title+subtitle at top
  const scoreH=120;      // space for score table + high score below field
  const promptH=40;      // space for start prompt at bottom
  const availH=H-titleH-scoreH-promptH;  // remaining for field
  const availW=W-40;

  // Scale field to fit the available space
  const attractScale=Math.min(availW/FIELD_W, availH/FIELD_H, 3);
  const attractOX=(W-FIELD_W*attractScale)/2;
  const fieldTop=titleH;

  // Title (screen coords)
  ctx.shadowColor='#ff2200';ctx.shadowBlur=20*pulse;
  ctx.strokeStyle='#ff2200';ctx.lineWidth=3;
  ctx.font='bold 36px monospace';
  const title='CENTIPEDE',tw=ctx.measureText(title).width;
  ctx.strokeText(title,W/2-tw/2,titleH-10);
  ctx.shadowBlur=10*pulse;
  ctx.fillStyle='rgba(255,34,0,0.3)';
  ctx.fillText(title,W/2-tw/2,titleH-10);

  // Subtitle
  ctx.shadowBlur=5;ctx.strokeStyle='#8f8';ctx.lineWidth=1.5;
  ctx.font='bold 12px monospace';
  const sub='ATARI ARCADE',sw=ctx.measureText(sub).width;
  ctx.strokeText(sub,W/2-sw/2,titleH+15);
  ctx.fillStyle='rgba(136,255,136,0.3)';
  ctx.fillText(sub,W/2-sw/2,titleH+15);

  // Field with crawling demo centipede
  ctx.save();ctx.translate(attractOX,fieldTop);ctx.scale(attractScale,attractScale);
  drawBackground();drawFieldBorder();

  // Crawling demo centipede (field-relative)
  const crawlY=FIELD_H*0.35;
  const crawlX=(t*30)%((FIELD_W+60))-30;
  for(let i=0;i<12;i++){
    const sx=crawlX-i*12, sy=crawlY+Math.sin(t*4+i*0.5)*3;
    const p=i/12;
    const r=Math.round(255*(1-p)), g=Math.round(100+155*p);
    const col=`rgb(${r},${g},20)`;
    ctx.shadowColor=col;ctx.shadowBlur=8-i*0.5;
    ctx.strokeStyle=col;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(sx,sy,5+i*0.1,4,0,0,Math.PI*2);ctx.stroke();
  }
  ctx.shadowBlur=0;
  ctx.restore();

  // Score table below field
  const scoreStartY=fieldTop+FIELD_H*attractScale+15;
  ctx.fillStyle='#aaa';ctx.font='11px monospace';
  const scores=[['CENTIPEDE SEGMENT','10'],['CENTIPEDE HEAD','100'],['SCORPION','100'],['SPIDER','75'],['FLYING SAUCER','250']];
  scores.forEach((s,i)=>{
    ctx.fillStyle='#888';ctx.fillText(s[0],W/2-140,scoreStartY+i*16);
    ctx.fillStyle='#ff4';ctx.fillText(s[1],W/2+120,scoreStartY+i*16);
  });

  // High score
  if(highScore>0){
    ctx.fillStyle='#ff0';ctx.font='bold 12px monospace';ctx.shadowColor='#ff0';ctx.shadowBlur=6;
    const hs='HIGH SCORE: '+highScore,hsw=ctx.measureText(hs).width;
    ctx.fillText(hs,W/2-hsw/2,scoreStartY+scores.length*16+15);ctx.shadowBlur=0;
  }

  // Blinking start prompt at bottom
  const blink=Math.sin(performance.now()/250)>0;
  if(blink){
    ctx.shadowColor='#ff4';ctx.shadowBlur=10;
    ctx.strokeStyle='#ff4';ctx.lineWidth=2;ctx.font='bold 16px monospace';
    const start='PRESS SPACE OR TAP',startw=ctx.measureText(start).width;
    ctx.strokeText(start,W/2-startw/2,H-15);
    ctx.fillStyle='rgba(255,255,68,0.3)';
    ctx.fillText(start,W/2-startw/2,H-15);
  }
  ctx.shadowBlur=0;
}

// === Wave clear message with animation ===
function drawWaveClear(){
  if(waveClearMsg&&waveClearFrames>0){
    // Original: bold green "WAVE CLEAR" centered on screen, pulsing glow
    const pulse=Math.sin(performance.now()/100)*5;
    ctx.shadowColor='#4f4';ctx.shadowBlur=12+pulse;
    ctx.strokeStyle='#4f4';ctx.lineWidth=2;ctx.font='bold 24px monospace';
    const tw=ctx.measureText(waveClearMsg).width;
    ctx.strokeText(waveClearMsg,W/2-tw/2,H/2-30);
    ctx.fillStyle='rgba(68,255,68,0.4)';
    ctx.fillText(waveClearMsg,W/2-tw/2,H/2-30);
    ctx.shadowBlur=0;
  }

  if(nextWaveDelay>0){
    // Original: "NEXT WAVE" blinking
    const blink=Math.sin(performance.now()/300)>0;
    if(blink){
      ctx.shadowColor='#ff4';ctx.shadowBlur=8;
      ctx.strokeStyle='#ff4';ctx.lineWidth=2;ctx.font='bold 20px monospace';
      const nw='NEXT WAVE',nw2=ctx.measureText(nw).width;
      ctx.strokeText(nw,W/2-nw2/2,H/2);
      ctx.fillStyle='rgba(255,255,68,0.4)';
      ctx.fillText(nw,W/2-nw2/2,H/2);
      ctx.shadowBlur=0;
    }
  }
}

// === Game over screen with arcade styling ===
function drawGameOver(){
  // Original: semi-transparent overlay with bold text
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);

  ctx.shadowColor='#ff2200';ctx.shadowBlur=15;
  ctx.strokeStyle='#ff2200';ctx.lineWidth=3;ctx.font='bold 36px monospace';
  const goText='GAME OVER',goW=ctx.measureText(goText).width;
  ctx.strokeText(goText,W/2-goW/2,H/2-50);
  ctx.shadowBlur=8;
  ctx.fillStyle='rgba(255,34,0,0.4)';
  ctx.fillText(goText,W/2-goW/2,H/2-50);

  ctx.shadowColor='#ff0';ctx.shadowBlur=6;
  ctx.fillStyle='#ff0';ctx.font='bold 18px monospace';
  const scText='SCORE: '+score,scW=ctx.measureText(scText).width;
  ctx.fillText(scText,W/2-scW/2,H/2);

  ctx.shadowColor='#4f4';ctx.shadowBlur=4;
  ctx.fillStyle='#4f4';ctx.font='bold 16px monospace';
  const wvText='WAVE: '+wave,wvW=ctx.measureText(wvText).width;
  ctx.fillText(wvText,W/2-wvW/2,H/2+35);

  // BUG FIX #17: Show high score on game over only if strictly greater
  if(score>highScore&&score>0){
    ctx.fillStyle='#ff0';ctx.font='bold 18px monospace';ctx.shadowColor='#ff0';ctx.shadowBlur=8;
    const nh='NEW HIGH SCORE!',nhw=ctx.measureText(nh).width;
    ctx.fillText(nh,W/2-nhw/2,H/2+65);
  }

  const blink=Math.sin(performance.now()/300)>0;
  if(blink){ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='bold 14px monospace';
    const rt='PRESS SPACE OR TAP',rtW=ctx.measureText(rt).width;
    ctx.fillText(rt,W/2-rtW/2,H/2+95);}
  ctx.shadowBlur=0;
}

// === Collision detection (all field-relative) ===
function checkCollisions(){
  // Bullet-mushroom collisions (bullets destroy mushrooms)
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];let bulletHit=false;

    // Check mushrooms first
    for(let mi=mushrooms.length-1;mi>=0&&!bulletHit;mi--){
      const m=mushrooms[mi];
      if(Math.hypot(b.x-m.x,b.y-m.y)<m.w/2+3){
        bullets.splice(bi,1);bulletHit=true;
        m.hp--;playSound('mushroom');
        // BUG FIX #16: Add visual feedback for mushroom damage
        addParticles(m.x,m.y,'#3a8030',4);
        if(m.hp<=0){
          addParticles(m.x,m.y,'#3a8030',6);
          mushrooms.splice(mi,1);
          // BUG FIX #12: Award points for destroying mushrooms (original: +1 per shot)
          score+=1;addFloatText(m.x,m.y,'+1','#4f4');
        }else{m.w*=0.8;m.h*=0.8;}
      }
    }
    if(bulletHit)continue;

    // Bullet-centipede collisions
    for(let ci=0;ci<centipedes.length&&!bulletHit;ci++){
      const c=centipedes[ci];
      for(let sk=c.segs.length-1;sk>=0;sk--){
        const seg=c.segs[sk];
        if(b.x>seg.x-seg.w/2&&b.x<seg.x+seg.w/2&&
           b.y>seg.y-seg.h/2&&b.y<seg.y+seg.h/2){
          bullets.splice(bi,1);bulletHit=true;

          if(c.segs.length===1){
            score+=200;addParticles(seg.x,seg.y,'#ff4422',15);
            addFloatText(seg.x,seg.y,['BONUS!','+200'],'#ff0');
            centipedes.splice(ci,1);playSound('explode');playSound('bonus');
          }else if(sk===0){
            score+=100;addParticles(seg.x,seg.y,'#ff4422',10);
            addFloatText(seg.x,seg.y,['HEAD!','+100'],'#f84');
            // Spawn scorpion from destroyed head (wave 2+)
            if(wave>=2)spawnScorpion(seg.x,seg.y);
            c.segs.splice(0,1);
            const newTrail=[];for(let i=0;i<c.segs.length*3+10;i++)newTrail.push({x:c.segs[0].x,y:c.segs[0].y});
            // Tail continues in SAME direction (not reversed)
            centipedes.push({segs:c.segs.slice(),dirX:c.dirX,speed:c.speed,mushCooldown:0,trail:newTrail});
            c.segs=[];playSound('hit');
          }else{
            score+=10;addParticles(seg.x,seg.y,'#cc3311',8);
            addFloatText(seg.x,seg.y,'+10','#ff8');
            // BUG FIX #9: Properly split centipede - keep front, create tail, destroy hit segment
            const tail=c.segs.splice(sk+1); // remove and return segments after hit
            c.segs.length=sk; // keep only front portion (0..sk-1), hit segment at index sk is removed
            if(tail.length>0){
              const newTrail=[];for(let i=0;i<tail.length*3+10;i++)newTrail.push({x:tail[0].x,y:tail[0].y});
              // BUG FIX #15: Tail also speeds up when body is hit
              centipedes.push({segs:tail,dirX:c.dirX,speed:c.speed*1.08,mushCooldown:0,trail:newTrail});
            }
            // Speed up remaining front centipede when body is hit
            c.speed*=1.08;playSound('hit');
          }
          break;
        }
      }
    }
  }

  // Clean up empty centipedes
  for(let i=centipedes.length-1;i>=0;i--){if(centipedes[i].segs.length===0)centipedes.splice(i,1);}

  // Bullet-scorpion collisions (only when moving)
  for(let bi=bullets.length-1;bi>=0&&!false;bi--){
    const b=bullets[bi];let scorpionHit=false;
    for(let si=scorpions.length-1;si>=0&&!scorpionHit;si--){
      const s=scorpions[si];
      if(s.state==='moving'&&Math.hypot(b.x-s.x,b.y-s.y)<8){
        bullets.splice(bi,1);scorpionHit=true;
        score+=100;addParticles(s.x,s.y,'#ff6600',15);
        addFloatText(s.x,s.y,['SCORPION','+100'],'#fa0');
        scorpions.splice(si,1);playSound('explode');
      }
    }
  }

  // Bullet-saucer collisions
  for(let bi=bullets.length-1;bi>=0&&!false;bi--){
    const b=bullets[bi];let saucerHit=false;
    for(let si=saucers.length-1;si>=0&&!saucerHit;si--){
      const s=saucers[si];
      if(Math.hypot(b.x-s.x,b.y-(s.y))<16){
        bullets.splice(bi,1);saucerHit=true;
        score+=250;addParticles(s.x,s.y,'#ff00ff',20);
        addFloatText(s.x,s.y,['SAUCER','+250'],'#f0f');
        saucers.splice(si,1);playSound('explode');
      }
    }
  }

  // Bullet-spider collisions (only when jumping)
  for(let bi=bullets.length-1;bi>=0&&!false;bi--){
    const b=bullets[bi];let spiderHit=false;
    for(let si=spiders.length-1;si>=0&&!spiderHit;si--){
      const s=spiders[si];
      if(s.state==='jumping'&&Math.hypot(b.x-s.x,b.y-s.y)<8){
        bullets.splice(bi,1);spiderHit=true;
        score+=75;addParticles(s.x,s.y,'#ff00aa',12);
        addFloatText(s.x,s.y,['SPIDER','+75'],'#f0a');
        spiders.splice(si,1);playSound('hit');
      }
    }
  }

  // Ship-centipede collision with invincibility check (all field-relative)
  if(ship&&!gameOver&&invincibleTimer<=0){
    let hit=false;
    for(let ci=0;ci<centipedes.length&&!hit;ci++){
      const c=centipedes[ci];
      for(let si=0;si<c.segs.length&&!hit;si++){
        const seg=c.segs[si];
        if(Math.hypot(ship.x-seg.x,ship.y-seg.y)<24){hit=true;}
      }
    }
    // Ship-scorpion collision
    if(!hit){
      for(let si=0;si<scorpions.length&&!hit;si++){
        const s=scorpions[si];
        if(s.state==='moving'&&Math.hypot(ship.x-s.x,ship.y-s.y)<20){hit=true;}
      }
    }
    // Ship-spider collision
    if(!hit){
      for(let si=0;si<spiders.length&&!hit;si++){
        const s=spiders[si];
        if(s.state==='jumping'&&Math.hypot(ship.x-s.x,ship.y-s.y)<20){hit=true;}
      }
    }
    // Ship-saucer bullet collision
    if(!hit){
      for(let si=0;si<saucerBullets.length&&!hit;si++){
        const sb=saucerBullets[si];
        if(Math.hypot(ship.x-sb.x,ship.y-sb.y)<16){hit=true;saucerBullets.splice(si,1);}
      }
    }
    if(hit){
      lives--;addParticles(ship.x,ship.y,'#2a6aaa',12);playSound('hurt');
      invincibleTimer=120;
      if(lives<=0){gameOver=true;}
      else ship={x:FIELD_W/2,y:FIELD_H-30};
    }
  }
}

// === Wave management ===
function checkWaveClear(){
  if(centipedes.length===0&&scorpions.length===0&&spiders.length===0&&waveClearMsg===''&&nextWaveDelay===0&&!gameOver){
    waveClearMsg='WAVE CLEAR!';waveClearFrames=120;playSound('waveclear');
    // Bonus points for remaining mushrooms
    const mushBonus=mushrooms.length*10;
    if(mushBonus>0){score+=mushBonus;addFloatText(FIELD_W/2,FIELD_H/2,['MUSH BONUS','+'+mushBonus],'#4f4');}
  }
}

function updateWaveTransition(){
  if(waveClearFrames>0){waveClearFrames--;return;}
  // Set nextWaveDelay after wave clear message finishes
  if(nextWaveDelay>0){nextWaveDelay--;if(nextWaveDelay===0)spawnNextWave();}
  else if(waveClearFrames===0&&waveClearMsg!==''){nextWaveDelay=90;waveClearMsg='';}
}

function spawnNextWave(){
  wave++;
  const numCentipedes=Math.min(wave,5);
  // BUG FIX #14: Stagger multiple centipedes with y offset
  for(let i=0;i<numCentipedes;i++)spawnCenti(i*15);
}

// === Particle and float text updates ===
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    p.vx*=0.95;p.vy*=0.95;
    if(p.life<=0)particles.splice(i,1);
  }
}

function updateFloatText(){
  for(let i=floatText.length-1;i>=0;i--){
    const ft=floatText[i];ft.y+=ft.vy;ft.life--;
    if(ft.life<=0)floatText.splice(i,1);
  }
}

// === Main game loop ===
function loop(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Handle attract state
  if(gameState==='attract'){drawAttract();requestAnimationFrame(loop);return;}

  // Save and apply scale transform for game area
  ctx.save();
  ctx.translate(OX,OY);
  ctx.scale(SCALE,SCALE);

  // Handle game over state
  if(gameOver){
    drawBackground();
    for(let i=0;i<mushrooms.length;i++)drawMush(mushrooms[i]);
    for(let i=0;i<centipedes.length;i++)drawCenti(centipedes[i]);
    for(let i=0;i<scorpions.length;i++)drawScorpion(scorpions[i]);
    for(let i=0;i<saucers.length;i++)drawSaucer(saucers[i]);
    for(let i=0;i<spiders.length;i++)drawSpider(spiders[i]);
    drawFieldBorder();drawGameOver();
    ctx.restore();
    // Save high score on game over
    if(score>highScore){highScore=score;localStorage.setItem('centipede_highscore',highScore);}
    if(gameState!=='gameover')playSound('gameover');
    gameState='gameover';
    requestAnimationFrame(loop);return;
  }

  // Ship movement (field-relative)
  if(keys.left)ship.x=Math.max(8,ship.x-4);
  if(keys.right)ship.x=Math.min(FIELD_W-8,ship.x+4);
  // Original Centipede: trackball = full 2D movement
  if(keys.up)ship.y=Math.max(FIELD_H*0.55,ship.y-4);
  if(keys.down)ship.y=Math.min(FIELD_H-10,ship.y+4);

  // Fire rate with cooldown timer (hold to fire)
  if(keys.fire){
    if(fireTimer<=0){
      // Original Centipede: only ONE bullet on screen at a time
      if(bullets.length<1){bullets.push({x:ship.x,y:ship.y-14,dy:-8});fireTimer=FIRE_COOLDOWN;playSound('shoot');}
    }
  }
  if(fireTimer>0)fireTimer--;

  // Update centipedes
  for(let i=centipedes.length-1;i>=0;i--)updateCenti(centipedes[i]);

  // Update scorpions
  for(let i=scorpions.length-1;i>=0;i--)updateScorpion(scorpions[i]);

  // Saucer spawning (wave 3+)
  if(wave>=3){saucerTimer++;if(saucerTimer>=SAUCER_INTERVAL){spawnSaucer();saucerTimer=0;}}

  // Update saucers
  for(let i=saucers.length-1;i>=0;i--){updateSaucer(saucers[i]);if(!saucers[i].alive)saucers.splice(i,1);}

  // Update spiders
  for(let i=spiders.length-1;i>=0;i--)updateSpider(spiders[i]);

  // Update bullets (field-relative)
  for(let i=bullets.length-1;i>=0;i--){bullets[i].y+=bullets[i].dy;if(bullets[i].y<-10)bullets.splice(i,1);}

  // Update saucer bullets
  for(let i=saucerBullets.length-1;i>=0;i--){
    const sb=saucerBullets[i];sb.y+=sb.dy;sb.life--;
    if(sb.y>FIELD_H||sb.life<=0)saucerBullets.splice(i,1);
  }

  // Check collisions
  checkCollisions();

  // Update invincibility timer
  if(invincibleTimer>0)invincibleTimer--;

  // Extra life every 10000 points
  if(score-extraLifeScore>=10000){extraLifeScore+=10000;lives=Math.min(lives+1,9);addFloatText(ship.x,ship.y-20,['EXTRA LIFE!'],'#4f4');playSound('waveclear');}

  // Update effects
  updateParticles();updateFloatText();

  // Wave management
  checkWaveClear();updateWaveTransition();

  // Draw everything (layered) - canvas transform handles scaling/positioning
  ctx.save();
  ctx.translate(OX,OY);ctx.scale(SCALE,SCALE);
  drawBackground();
  for(let i=0;i<mushrooms.length;i++)drawMush(mushrooms[i]);
  for(let i=0;i<centipedes.length;i++)drawCenti(centipedes[i]);
  for(let i=0;i<scorpions.length;i++)drawScorpion(scorpions[i]);
  for(let i=0;i<spiders.length;i++)drawSpider(spiders[i]);
  for(let i=0;i<saucers.length;i++)drawSaucer(saucers[i]);
  for(let i=0;i<bullets.length;i++)drawBullet(bullets[i]);
  // Draw saucer bullets (field-relative)
  for(let i=0;i<saucerBullets.length;i++){
    const sb=saucerBullets[i];
    ctx.shadowColor='#ff4400';ctx.shadowBlur=8;
    ctx.strokeStyle='#ff4400';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sb.x,sb.y-4);ctx.lineTo(sb.x,sb.y+4);ctx.stroke();
    ctx.fillStyle='#ff8844';
    ctx.beginPath();ctx.arc(sb.x,sb.y+4,2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  if(ship)drawShip(ship);
  drawFieldBorder();
  drawParticles();drawFloatText();
  ctx.restore();
  drawHUD();drawWaveClear();

  requestAnimationFrame(loop);
}

// === Start in attract mode ===
window.addEventListener('load',function(){resize();gameState='attract';setTimeout(function(){loop();},300);});
if(document.readyState==='complete'){resize();gameState='attract';setTimeout(function(){loop();},300);};
</script>
