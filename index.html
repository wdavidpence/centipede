<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Centipede</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Courier New",monospace;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#fireBtn{position:fixed;z-index:5;right:16px;bottom:20px;width:84px;height:84px;border-radius:50%;background:rgba(10,30,20,.55);border:2px solid rgba(60,255,120,.5);color:#8f9;font-size:15px;font-weight:bold;display:none;align-items:center;justify-content:center}
@media(pointer:coarse){#fireBtn{display:flex}}
#muteBtn{position:fixed;z-index:5;left:12px;bottom:14px;padding:6px 10px;border:1px solid rgba(60,255,120,.4);border-radius:6px;background:rgba(0,0,0,.5);color:#8f9;font-size:11px;display:none}
@media(pointer:coarse){#muteBtn{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fireBtn">FIRE</div>
<div id="muteBtn" role="button" tabindex="0" aria-label="Toggle mute">MUTE</div>
<script src="game.js"></script>
</body>
</html>
