<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#03040c">
<title>Centipede — Modern Arcade</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#03040c;color:#fff;font-family:"Courier New",monospace;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#fireBtn{position:fixed;z-index:5;right:18px;bottom:24px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(80,255,150,.28),rgba(10,30,20,.55));border:2px solid rgba(60,255,120,.55);box-shadow:0 0 18px rgba(60,255,120,.25),inset 0 0 14px rgba(60,255,120,.18);color:#9f9;font-size:15px;font-weight:bold;letter-spacing:1px;display:none;align-items:center;justify-content:center;text-shadow:0 0 8px rgba(60,255,120,.8)}
@media(pointer:coarse){#fireBtn{display:flex}}
#muteBtn{position:fixed;z-index:5;left:12px;bottom:14px;padding:7px 12px;border:1px solid rgba(60,255,120,.4);border-radius:8px;background:rgba(3,8,14,.6);color:#8f9;font-size:11px;letter-spacing:1px;display:none;box-shadow:0 0 10px rgba(60,255,120,.15)}
@media(pointer:coarse){#muteBtn{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fireBtn">FIRE</div>
<div id="muteBtn" role="button" tabindex="0" aria-label="Toggle mute">MUTE</div>
<script src="game.js"></script>
</body>
</html>
